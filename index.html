<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「來！學華語」課文跟讀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F6F2E9;--card:#FBF9F4;--ink:#2A2724;--ink-soft:#7B746B;--ink-faint:#B3AA9C;
  --line:#D9D1C3;--shu:#B5442E;--ai:#3E5266;
  --serif:'Noto Serif TC','Hiragino Mincho ProN','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','Hiragino Sans','PingFang TC',sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;min-height:100vh;display:flex;flex-direction:column;font-size:clamp(13.6px,1.6vw,19.2px);line-height:1.6}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.wrap{width:92vw;max-width:1120px;margin:0 auto;padding:clamp(16px,2.4vw,35.2px) 0 40px}
.top{display:flex;align-items:center;gap:14px;padding:clamp(11.2px,1.6vw,19.2px) 4vw;border-bottom:1px solid var(--line)}
.back{background:none;border:none;color:var(--ink-soft);font-size:clamp(22.4px,2.56vw,32px);cursor:pointer;padding:2px 10px;line-height:1}
.back:hover{color:var(--shu)}
.top-title{font-family:var(--serif);font-weight:500;font-size:clamp(19.2px,2.4vw,30.4px);letter-spacing:.08em}
.top-sub{font-size:clamp(12.8px,1.44vw,17.6px);color:var(--ink-soft);margin-left:6px;letter-spacing:.05em}
/* home */
.hero{text-align:center;padding:clamp(32px,6.4vw,88px) 4vw clamp(19.2px,3.2vw,44.8px)}
.dot{width:clamp(12.8px,1.6vw,19.2px);height:clamp(12.8px,1.6vw,19.2px);border-radius:50%;background:var(--shu);margin:0 auto clamp(14.4px,1.92vw,24px)}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(27.2px,4.16vw,54.4px);letter-spacing:.14em;line-height:1.4}
.hero p{margin-top:12px;color:var(--ink-soft);font-size:clamp(12.8px,1.6vw,19.2px);letter-spacing:.2em}
.rule{width:clamp(32px,4.8vw,64px);height:1px;background:var(--ink-faint);margin:clamp(14.4px,2.08vw,27.2px) auto 0}
.vols{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(11.2px,1.6vw,22.4px)}
.vol{font-family:var(--serif);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:clamp(17.6px,2.72vw,38.4px) 10px;text-align:center;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.vol .num{display:block;font-size:clamp(35.2px,5.12vw,72px);font-weight:500;line-height:1.1;color:var(--shu)}
.vol .name{display:block;margin-top:10px;font-size:clamp(16px,2.08vw,25.6px);letter-spacing:.2em}
.vol:hover{border-color:var(--shu);background:#fff}
.vol.off{cursor:default;color:var(--ink-faint);background:transparent}
.vol.off .num{color:var(--ink-faint)}
.vol.off:hover{border-color:var(--line);background:transparent}
.vol .soon{display:block;margin-top:4px;font-family:var(--sans);font-size:clamp(11.2px,1.28vw,15.2px);letter-spacing:.15em}
/* lesson picker */
.toc{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6.4px,0.96vw,12.8px);margin-bottom:clamp(12.8px,1.92vw,25.6px)}
.toc button{font-family:var(--serif);font-weight:500;font-size:clamp(13.6px,1.84vw,24px);cursor:pointer;background:var(--card);color:var(--ai);border:1px solid var(--line);border-radius:4px;padding:clamp(9.6px,1.28vw,17.6px) 4px;letter-spacing:.08em;transition:all .15s}
.toc button:hover{border-color:var(--shu)}
.toc button.active{background:var(--shu);border-color:var(--shu);color:#fff}
.ltitle{font-family:var(--serif);color:var(--ink-soft);font-size:clamp(14.4px,1.76vw,22.4px);letter-spacing:.12em;margin:0 0 clamp(8px,1.12vw,14.4px) 4px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:clamp(19.2px,2.72vw,41.6px) clamp(16px,2.72vw,41.6px);margin-bottom:clamp(12.8px,1.92vw,25.6px);min-height:144px}
.line{font-family:var(--serif);font-weight:500;font-size:clamp(23.2px,3.31vw,44.8px);line-height:1.6;margin-bottom:.3em;letter-spacing:.04em;padding-left:.2em;border-left:3px solid transparent;transition:border-color .2s}
.line:last-child{margin-bottom:0}
.line.now{border-left-color:var(--shu)}
.c-done{color:var(--ink-faint)}
.c-cur{color:var(--shu);border-bottom:3px solid var(--shu);font-weight:700}
.c-next{color:var(--ink)}
.panel{border-top:1px solid var(--line);padding-top:clamp(12.8px,1.92vw,24px);display:flex;flex-direction:column;gap:clamp(12.8px,1.76vw,22.4px)}
.speed{display:flex;align-items:center;gap:16px}
.speed label{font-size:clamp(16px,1.76vw,22.4px);color:var(--ink-soft);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:2px;background:var(--ink-faint);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:clamp(20.8px,2.4vw,28.8px);height:clamp(20.8px,2.4vw,28.8px);border-radius:50%;background:var(--shu);border:4px solid var(--card);box-shadow:0 0 0 1px var(--shu)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--shu);border:4px solid var(--card)}
.cpm{text-align:center;color:var(--ink-soft);font-size:clamp(14.4px,1.6vw,20.8px);letter-spacing:.1em;margin-top:-6px}
.top-panel{border-top:none;padding-top:0;margin-bottom:clamp(12.8px,1.92vw,25.6px)}
.bottom-btns{margin-top:0}
.btns{display:flex;gap:clamp(8px,1.28vw,16px)}
.act{font-family:var(--sans);font-weight:500;font-size:clamp(17.6px,2.16vw,27.2px);letter-spacing:.2em;cursor:pointer;border-radius:4px;padding:clamp(11.2px,1.44vw,17.6px) 20px;flex:1;transition:all .15s}
.go{background:var(--ink);border:1px solid var(--ink);color:var(--paper)}
.go:hover{background:var(--shu);border-color:var(--shu)}
.again{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.again:hover{border-color:var(--shu);color:var(--shu)}
.credit{text-align:center;font-size:13px;color:var(--ink-faint);letter-spacing:.12em;padding:18px 10px 22px;margin-top:auto}
</style>
</head>
<body>

<section class="screen on" id="home">
  <div class="hero">
    <div class="dot"></div>
    <h1>「來！學華語」<br>課文跟讀</h1>
    <p>Let's Learn Mandarin</p>
    <div class="rule"></div>
  </div>
  <div class="wrap" style="padding-top:0">
    <div class="vols" id="vols"></div>
  </div>
</section>

<section class="screen" id="vol">
  <div class="top">
    <button class="back" onclick="goHome()" title="返回">&larr;</button>
    <span class="top-title" id="vol-title">第一冊</span><span class="top-sub">課文跟讀</span>
  </div>
  <div class="wrap">
    <div class="toc" id="toc"></div>
    <div class="ltitle" id="ltitle"></div>
    <div class="panel top-panel">
      <div class="speed"><label>慢</label><input type="range" id="speed" min="100" max="260" step="5" value="150"><label>快</label></div>
      <div class="cpm" id="cpm"></div>
      <div class="btns"><button class="act go" id="go">&#9654; 開始</button></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="btns bottom-btns"><button class="act again" id="again">&#8635; 再一次</button></div>
  </div>
  <audio id="player" preload="auto"></audio>
</section>

<footer class="credit">Shelleytaiwan 製作 · 2026 · 請勿商用</footer>

<script>
const DATA = {"vols":[{"lessons":[{"n":1,"title":"您好","lines":[{"t":"您好。","a":0.95,"b":1.89,"c":[1.0,1.2]},{"t":"您好。","a":2.69,"b":3.77,"c":[2.84,3.28]},{"t":"我姓王，請問您貴姓？","a":4.37,"b":7.65,"c":[4.44,4.56,4.72,5.8,6.0,6.32,6.96,7.28]},{"t":"我姓Lee，叫Gloria。您叫什麼名字？","a":8.47,"b":13.97,"c":[8.48,8.8,9.32,9.84,10.69,11.54,12.4,12.72,13.0,13.05,13.68]},{"t":"我叫明文。請問您是哪國人？","a":14.48,"b":19.5,"c":[14.48,14.92,15.38,15.84,16.96,17.2,17.52,17.84,18.16,18.68,18.8]},{"t":"我是美國人。您呢？","a":20.2,"b":23.59,"c":[20.2,20.72,21.04,21.36,21.68,23.04,23.28]},{"t":"我是臺灣人。","a":24.47,"b":26.69,"c":[24.48,24.8,25.2,25.52,25.84]}],"audio":"audio/v1/L01.mp3"},{"n":2,"title":"我有兩個弟弟","lines":[{"t":"明文，你好。","a":0.95,"b":3.36,"c":[1.0,1.82,2.54,2.86]},{"t":"妳好，Gloria。","a":3.8,"b":6.78,"c":[3.8,4.74,6.28]},{"t":"明文，你有兄弟姊妹嗎？","a":7.82,"b":12.1,"c":[7.82,8.76,9.7,9.9,10.54,10.86,11.22,11.58,11.78]},{"t":"我有一個姊姊，兩個弟弟。妳呢？","a":13.0,"b":18.31,"c":[13.14,13.46,13.7,13.75,14.27,14.8,15.34,15.94,16.26,16.31,17.1,17.9]},{"t":"我也有一個姊姊。","a":19.42,"b":22.08,"c":[19.42,19.74,19.82,20.14,20.46,21.02,21.58]},{"t":"妳有哥哥嗎？","a":22.14,"b":24.27,"c":[22.14,22.7,23.42,23.47,23.9]},{"t":"我沒有哥哥，也沒有弟弟。我只有一個姊姊。","a":25.56,"b":32.9,"c":[25.66,25.9,26.22,26.5,26.55,28.02,28.14,28.46,29.74,30.06,30.22,31.14,31.34,31.66,31.94,32.34,32.74]}],"audio":"audio/v1/L02.mp3"},{"n":3,"title":"她不是學生","lines":[{"t":"Gloria，你姊姊是學生嗎？","a":0.95,"b":4.7,"c":[1.0,2.31,2.71,3.11,3.51,3.99,4.19,4.51]},{"t":"她不是學生，她大學畢業了。","a":5.23,"b":10.1,"c":[5.23,5.95,6.27,6.59,6.79,7.67,8.55,8.71,9.23,9.35,9.67]},{"t":"她在哪裡工作？","a":10.45,"b":13.07,"c":[10.45,11.23,11.59,11.71,12.47,12.55]},{"t":"我姊姊在銀行工作，她先生在電腦公司工作。","a":13.99,"b":21.37,"c":[13.99,14.36,14.73,15.11,15.99,16.07,16.23,16.39,17.27,18.15,18.31,18.91,19.47,19.59,20.11,20.47,20.71,20.87]},{"t":"你姊姊結婚了，他們有孩子嗎？","a":22.24,"b":27.38,"c":[22.19,22.53,22.88,23.23,23.39,23.44,25.19,25.35,25.95,26.55,26.63,26.95]},{"t":"他們有兩個孩子，一個兒子、一個女兒。兩個小孩都在小學念書。","a":28.43,"b":38.82,"c":[28.43,28.75,29.23,29.55,29.71,29.83,30.15,31.43,31.71,32.03,32.39,33.19,33.35,33.67,33.99,35.27,35.59,35.83,35.91,36.55,36.87,37.19,37.71,37.83,38.39]}],"audio":"audio/v1/L03.mp3"},{"n":4,"title":"我爸爸在電腦公司工作","lines":[{"t":"明文，請問你爸爸、媽媽在哪裡工作？","a":0.95,"b":6.85,"c":[1.0,2.35,2.75,2.95,3.27,3.75,3.91,4.59,4.87,5.19,5.63,5.83,6.31,6.47]},{"t":"我爸爸在電腦公司工作，我媽媽是小學老師。","a":7.57,"b":14.93,"c":[7.59,7.91,8.07,8.71,9.27,9.35,9.79,9.99,10.47,10.63,11.59,12.07,12.23,12.99,13.43,13.79,14.11,14.47]},{"t":"你爸爸的工作忙不忙？","a":15.75,"b":18.91,"c":[15.75,16.27,16.39,16.71,16.99,17.04,17.67,18.11,18.51]},{"t":"他的工作很忙，他每天都很累。","a":19.43,"b":24.54,"c":[19.43,20.03,20.23,20.55,20.83,21.19,22.07,22.63,22.79,23.39,23.67,24.07]},{"t":"你媽媽呢？","a":25.03,"b":26.45,"c":[25.03,25.75,25.91,25.99]},{"t":"她喜歡小孩子，她說教書不累。","a":27.03,"b":31.98,"c":[27.03,27.27,27.59,27.91,28.23,28.55,29.43,29.79,30.43,30.79,31.27,31.67]},{"t":"我爸爸也是老師，他在大學教法文。","a":32.67,"b":38.34,"c":[32.67,33.03,33.19,33.67,34.15,34.47,34.63,35.59,35.91,36.39,36.55,37.27,37.47,37.83]}],"audio":"audio/v1/L04.mp3"},{"n":5,"title":"歡迎你來","lines":[{"t":"Gloria，好久不見。","a":0.95,"b":3.68,"c":[1.0,2.43,2.67,3.11,3.31]},{"t":"你好，好久不見。","a":5.05,"b":8.43,"c":[5.03,5.27,6.71,7.35,7.51,7.83]},{"t":"這是我弟弟，王家文。家文，這是我朋友，Gloria。","a":9.41,"b":18.02,"c":[9.47,9.75,10.07,10.39,10.71,11.47,11.67,11.99,13.07,14.15,14.95,15.39,15.51,16.07,16.15,17.79]},{"t":"你好，家文，認識你很高興。","a":19.43,"b":24.73,"c":[19.43,19.67,20.59,21.51,22.59,22.79,22.87,23.51,23.83,24.15]},{"t":"Gloria，我也很高興認識妳。","a":25.77,"b":29.77,"c":[25.77,27.39,27.47,27.63,27.91,27.99,28.31,28.63,29.27]},{"t":"家文，你也在美國念書嗎？","a":29.91,"b":34.23,"c":[29.91,30.55,31.59,31.99,32.15,32.47,32.79,33.11,33.63,33.75]},{"t":"不是，我平常住在臺灣。現在學校放假，我來美國玩。","a":35.57,"b":42.02,"c":[35.47,35.67,36.43,36.63,36.95,37.31,37.51,37.59,37.91,38.67,38.87,39.35,39.51,39.87,40.15,40.47,40.75,41.11,41.35,41.43]},{"t":"歡迎你來美國。你想去哪裡玩？","a":42.75,"b":47.69,"c":[42.75,43.19,43.35,43.67,43.99,44.31,45.91,45.99,46.23,46.55,46.87,47.15]},{"t":"我想去迪士尼樂園玩，也想去國家公園玩。","a":48.59,"b":53.24,"c":[48.59,48.91,49.11,49.47,49.63,49.75,50.03,50.08,50.55,51.15,51.35,51.63,51.91,51.99,52.43,52.59,52.83]}],"audio":"audio/v1/L05.mp3"},{"n":6,"title":"你平常喜歡做什麼？","lines":[{"t":"家文，你喜歡不喜歡運動？","a":0.84,"b":5.81,"c":[0.89,1.45,2.85,3.25,3.41,4.09,4.29,4.37,5.13,5.33]},{"t":"我喜歡運動，我平常喜歡跑步。","a":6.61,"b":11.4,"c":[6.61,7.17,7.49,8.21,8.53,9.21,9.57,9.81,10.17,10.45,10.77,11.09]},{"t":"你哥哥平常喜歡做什麼？","a":12.53,"b":16.26,"c":[12.73,13.09,13.14,14.05,14.37,14.57,14.93,15.61,15.81,15.89]},{"t":"他平常喜歡跑步，週末喜歡去打網球。妳呢？","a":17.35,"b":24.47,"c":[17.53,17.85,18.13,18.41,18.73,19.17,19.41,20.57,20.97,21.33,21.61,21.93,22.65,22.77,22.93,23.57,24.21]},{"t":"我不喜歡運動。我喜歡唱歌、聽音樂和跳舞。","a":25.61,"b":34.48,"c":[25.69,26.09,26.41,26.73,27.73,28.05,28.69,29.29,29.61,29.97,30.29,31.57,32.13,32.21,32.93,33.65,33.81]},{"t":"我哥哥和我也喜歡唱歌，可是我們都不喜歡跳舞。","a":35.49,"b":42.58,"c":[35.49,35.73,35.85,36.27,36.69,37.01,37.53,37.65,37.97,38.29,39.13,39.53,40.05,40.21,40.53,40.81,41.21,41.49,41.81,42.13]},{"t":"我還喜歡看電視，我晚上常常在家看電視。","a":43.57,"b":51.32,"c":[43.57,44.33,44.65,44.7,45.37,45.73,45.97,47.53,47.97,48.21,48.53,48.85,49.17,49.49,50.17,50.45,50.77]},{"t":"我在臺灣，晚上喜歡去公園跑步。","a":52.21,"b":56.95,"c":[52.21,52.69,53.01,53.33,53.81,54.29,54.73,54.93,55.17,55.57,55.89,56.17,56.53]}],"audio":"audio/v1/L06.mp3"},{"n":7,"title":"請問您是哪位？","lines":[{"t":"喂，台一銀行，您好！","a":0.95,"b":5.22,"c":[1.0,3.15,3.55,3.95,4.35,4.75,5.15]},{"t":"喂，您好！請問林美美小姐在嗎？","a":5.27,"b":10.04,"c":[5.55,5.95,6.35,6.75,6.95,7.95,8.35,8.51,8.56,8.87,9.47,9.79]},{"t":"林小姐現在不在辦公室，請問您是哪位？","a":11.13,"b":17.93,"c":[11.02,11.22,11.29,12.25,12.51,12.76,12.91,13.48,13.73,14.14,15.53,15.78,16.19,16.6,16.96,17.03]},{"t":"我是北電公司的Gloria。請問林小姐什麼時候回來？","a":19.21,"b":27.3,"c":[19.13,19.29,19.93,20.37,20.53,20.89,21.21,22.35,23.49,23.77,24.09,24.65,24.73,25.49,25.65,25.97,26.02,26.33,26.65]},{"t":"Gloria，林小姐下午回來。","a":28.26,"b":31.88,"c":[28.17,29.69,29.81,29.86,30.57,30.81,31.05,31.13]},{"t":"麻煩您，請她回來以後給我打電話。","a":33.37,"b":38.7 :[92.77,93.71,94.65,94.89,95.19,95.61,95.79,96.33,96.63,97.05,97.23,98.14,98.38,98.86,99.1,99.52,99.76]},{"t":"這個星期六高莉亞的朋友要來吃晚飯，她得跟何希一起準備晚飯，所以週末他們一定都很忙。","a":101.29,"b":116.32,"c":[101.37,101.55,101.79,102.09,102.27,103.17,103.43,103.69,103.95,104.19,104.43,105.03,105.39,105.69,106.05,106.35,107.17,107.99,108.35,108.77,109.22,109.67,109.91,110.51,110.81,111.23,111.47,112.45,112.63,113.23,113.41,113.95,114.25,114.67,114.85,115.21,115.51,115.87]}],"audio":"audio/v2/L08.mp3"},{"n":9,"title":"我感冒了","lines":[{"t":"醫生，你好！","a":0.71,"b":2.73,"c":[0.79,0.97,2.1,2.28]},{"t":"高莉亞，妳怎麼了？","a":3.85,"b":6.9,"c":[3.99,4.45,4.9,5.36,5.82,6.18,6.48]},{"t":"我今天早上起床以後，覺得很不舒服。我的頭很痛，肚子也有一點痛。什麼東西都不想吃。","a":7.85,"b":23.75,"c":[7.93,8.17,8.35,8.83,9.07,9.67,9.91,10.27,10.45,11.74,11.92,12.22,12.52,12.82,13.06,14.84,15.02,15.26,15.8,16.1,17.5,17.68,18.22,18.52,18.82,19.0,19.3,21.2,21.38,21.68,21.86,22.4,22.7,23.0,23.3]},{"t":"妳流鼻水嗎？咳嗽嗎？","a":24.27,"b":28.82,"c":[24.37,25.44,25.8,26.04,26.4,27.77,27.95,28.43]},{"t":"我流鼻水，但是沒咳嗽。","a":29.8,"b":33.67,"c":[29.82,30.18,30.48,30.72,31.96,32.14,32.56,32.98,33.22]},{"t":"妳也沒發燒，我來看看。","a":34.03,"b":38.84,"c":[34.13,35.04,35.4,35.88,36.18,37.4,37.64,38.06,38.42]},{"t":"妳感冒了。要多喝水，多休息。不需要吃藥。","a":39.34,"b":47.26,"c":[39.34,40.08,40.44,40.74,41.74,42.04,42.46,42.76,43.69,43.99,44.29,45.49,45.79,46.03,46.51,46.81]},{"t":"妳昨天怎麼沒來上班？","a":48.23,"b":52.18,"c":[48.23,49.39,49.69,50.23,50.53,50.77,51.07,51.43,51.73]},{"t":"我又生病了。","a":53.49,"b":55.22,"c":[53.57,53.81,54.23,54.47,54.77]},{"t":"妳去看醫生了嗎？","a":55.74,"b":58.86,"c":[55.84,56.91,57.15,57.63,57.81,58.17,58.41]},{"t":"去了。我去我家附近的醫院，醫生說我感冒了。","a":59.99,"b":67.43,"c":[60.07,60.31,61.7,61.88,62.24,62.54,63.08,63.26,63.5,63.8,63.98,65.28,65.4,65.76,66.06,66.42,66.72,67.02]},{"t":"現在覺得怎麼樣？","a":68.5,"b":70.83,"c":[68.58,68.82,69.36,69.72,70.02,70.26,70.38]},{"t":"已經好多了。我覺得健康太重要了，以後得常常運動，注意身體。","a":72.18,"b":83.05,"c":[72.26,72.44,72.86,73.16,73.4,74.85,75.03,75.33,76.05,76.23,76.65,77.01,77.25,77.49,78.82,78.94,79.36,80.02,80.2,80.62,80.8,81.82,82.06,82.36,82.6]},{"t":"對，運動很重要，我們都應該多運動。","a":84.44,"b":90.99,"c":[84.46,85.69,85.87,86.41,86.83,87.07,88.26,88.38,88.68,89.1,89.28,89.76,90.3,90.54]},{"t":"所以我打算下個星期開始每天跟何希一起去游泳。","a":92.47,"b":101.39,"c":[92.55,92.79,93.21,93.51,93.81,94.79,95.15,95.39,95.57,95.99,96.23,97.64,97.88,98.3,98.78,99.26,99.74,99.92,100.28,100.7,100.94]}],"audio":"audio/v2/L09.mp3"},{"n":10,"title":"高莉亞想去臺灣","lines":[{"t":"喂，高莉亞，好久不見。妳在家吧？在做什麼呢？","a":0.75,"b":8.22,"c":[0.83,1.73,2.15,2.58,3.0,3.18,3.48,3.66,4.27,4.88,5.24,5.54,6.56,6.8,7.22,7.58,7.82]},{"t":"我在看電視呢！明文，你最近怎麼樣？","a":9.13,"b":15.71,"c":[9.15,9.39,9.75,10.17,10.47,10.77,11.64,12.5,13.7,14.06,14.24,14.78,15.02,15.26]},{"t":"我快畢業了，在寫畢業論文。","a":17.07,"b":21.21,"c":[17.15,17.27,17.75,17.99,18.23,19.2,19.44,20.04,20.22,20.58,20.76]},{"t":"那麼，你最近一定很忙。畢業以後，你有什麼計畫？","a":22.38,"b":31.04,"c":[22.46,22.64,23.52,23.82,24.12,24.72,24.9,25.2,25.5,27.39,27.57,27.93,28.11,29.15,29.39,29.75,30.05,30.41,30.59]},{"t":"我打算一畢業就回臺灣找工作。","a":32.24,"b":37.11,"c":[32.32,32.5,32.8,33.28,33.64,33.82,34.62,34.86,35.4,35.58,36.06,36.42,36.66]},{"t":"希望你能找到一個自己喜歡的工作。","a":38.61,"b":43.46,"c":[38.81,38.99,39.29,39.59,39.89,40.13,40.49,40.67,41.27,41.57,42.05,42.29,42.59,42.83,43.01]},{"t":"妳夏天有什麼計畫？","a":44.15,"b":48.28,"c":[44.25,45.49,45.85,46.45,46.87,47.23,47.65,47.83]},{"t":"我打算休假，出國旅行。","a":49.61,"b":53.32,"c":[49.69,49.99,50.29,50.71,50.95,52.03,52.21,52.69,52.87]},{"t":"妳去過亞洲嗎？想不想去臺灣看看？我帶妳去一些有意思的地方。","a":53.7,"b":64.95,"c":[53.8,54.73,55.03,55.51,55.81,56.11,57.41,57.59,57.77,58.13,58.73,58.97,59.33,59.69,61.02,61.2,61.56,61.92,62.34,62.52,63.0,63.42,63.66,64.02,64.26,64.5]},{"t":"這個機會太好了！我只去過日本，沒去過臺灣。","a":66.64,"b":74.5,"c":[66.72,66.9,67.14,67.38,67.8,68.22,68.52,70.01,70.25,70.61,70.91,71.33,71.57,72.73,72.97,73.33,73.87,74.05]},{"t":"如果妳的假期很長，可以在臺灣上中文課。","a":76.24,"b":82.34,"c":[76.38,76.56,76.89,77.22,77.46,77.7,78.12,78.36,79.43,79.61,79.85,80.27,80.45,80.81,81.35,81.53,81.89]},{"t":"今年夏天不行，我的假期只有兩個星期，太短了。","a":83.53,"b":91.45,"c":[83.67,83.85,84.15,84.51,84.93,85.11,86.53,86.71,87.01,87.25,87.85,88.09,88.51,88.81,89.05,89.23,90.46,90.64,91.0]},{"t":"沒關係，我回臺灣以後，妳什麼時候來都行。","a":92.53,"b":98.96,"c":[92.61,92.85,93.09,94.18,94.42,94.78,94.96,95.32,95.5,96.08,96.65,96.89,97.19,97.43,97.79,98.21,98.51]}],"audio":"audio/v2/L10.mp3"}]},{"lessons":[{"n":1,"title":"歡迎新同學","lines":[{"t":"大家好，今天是這個學期的第一天。","a":0.8,"b":6.33,"c":[0.88,1.06,1.3,2.7,2.88,3.24,3.6,3.84,4.08,4.32,4.62,5.04,5.34,5.58]},{"t":"林老師，好久不見。","a":7.12,"b":10.27,"c":[7.2,7.44,7.62,8.79,8.97,9.27,9.51]},{"t":"你們夏天的時候做了什麼？","a":11.06,"b":14.95,"c":[11.14,11.32,11.62,11.98,12.28,12.52,12.76,13.36,13.72,14.02,14.32]},{"t":"我跟先生去墨西哥度假了，玩得非常高興。","a":15.66,"b":22.49,"c":[15.74,15.98,16.28,16.52,17.06,17.6,17.84,18.14,18.62,18.8,19.04,20.11,20.35,20.83,21.07,21.43,21.67]},{"t":"我們公司夏天的時候最忙，我差不多每個星期都加班。","a":23.29,"b":32.27,"c":[23.37,23.55,23.91,24.15,24.75,25.17,25.47,25.77,26.07,26.61,26.97,28.11,28.41,28.71,28.89,29.43,29.67,29.97,30.21,30.75,31.17,31.47]},{"t":"你好辛苦啊！","a":33.07,"b":35.48,"c":[33.15,33.39,33.99,34.17,34.47]},{"t":"請問，這是102教室嗎？","a":36.25,"b":40.54,"c":[36.33,36.57,37.59,37.83,39.21,39.45,39.75]},{"t":"是，請進。妳有什麼事？","a":41.34,"b":46.52,"c":[41.42,42.68,42.98,44.43,44.73,45.09,45.39,45.69]},{"t":"我來上中文課。請問您是林老師嗎？","a":47.08,"b":52.51,"c":[47.16,47.4,47.7,48.12,48.3,48.54,49.6,49.72,50.14,50.5,50.92,51.16,51.28,51.58]},{"t":"我就是林老師。歡迎歡迎。妳以前學過中文嗎？","a":53.31,"b":61.46,"c":[53.39,53.69,54.05,54.65,54.89,55.07,56.34,56.58,57.12,57.24,58.55,58.85,59.03,59.63,60.05,60.53,60.71,60.95]},{"t":"我以前學了兩年多。上個月我換工作，從東部搬到這裡。我想繼續學中文。","a":62.26,"b":73.54,"c":[62.34,62.58,62.88,63.36,63.66,63.96,64.2,64.5,65.51,65.81,65.99,66.47,66.77,67.13,67.31,68.27,68.63,68.81,69.29,69.47,69.77,70.01,70.89,71.19,71.61,71.85,72.15,72.57,72.75]},{"t":"請妳介紹一下自己吧？","a":74.32,"b":78.07,"c":[74.4,74.7,75.24,75.42,75.84,76.02,76.44,76.74,77.04]},{"t":"大家好，我姓張，名字叫家安。家人的「家」，平安的「安」。我在貿易公司工作。我的興趣是照相，收集了很多鳥和貓的照片。","a":78.83,"b":99.09," 旅館離海邊很近，在旅館就可以看到海邊，風景很漂亮。","a":72.74,"b":86.45,"c":[72.82,73.0,73.54,73.84,74.26,74.5,75.34,76.06,76.3,76.84,77.08,78.81,79.23,79.41,80.19,80.61,80.97,81.39,81.75,82.41,82.59,84.02,84.2,84.74,85.22,85.52]},{"t":"我想晚上也很美。","a":87.25,"b":90.52,"c":[87.33,87.51,88.23,88.41,88.89,89.19,89.49]},{"t":"是啊！我們在海邊，一邊散步，一邊看天上的星星，心情很輕鬆。","a":91.11,"b":104.42,"c":[91.19,91.55,92.99,93.17,93.53,94.07,94.31,95.57,95.75,96.23,96.59,98.03,98.21,98.69,99.35,99.65,100.01,100.37,100.67,102.13,102.37,102.91,103.39,103.63]},{"t":"你們是怎麼去的？","a":105.11,"b":107.72,"c":[105.19,105.43,105.67,105.91,106.21,106.39,106.69]},{"t":"我們是搭飛機去的，到了那裡再租車去旅館，很方便。","a":108.5,"b":118.69,"c":[108.58,108.76,109.12,109.6,110.08,110.32,110.68,111.1,112.49,112.67,113.03,113.21,113.75,114.35,114.59,115.25,115.85,116.09,117.15,117.51,117.81]},{"t":"我決定下個假期也去那裡度假。","a":119.49,"b":124.07,"c":[119.57,119.81,120.05,120.53,120.83,121.13,121.37,121.85,122.15,122.63,122.81,123.17,123.35]}],"audio":"audio/v3/L02.mp3"},{"n":3,"title":"感恩節","lines":[{"t":"嗨！高莉亞，在想什麼？","a":0.77,"b":5.22,"c":[0.85,2.3,2.54,2.72,3.69,3.93,4.29,4.53]},{"t":"麗莎，我在想怎麼過感恩節。","a":6.02,"b":11.75,"c":[6.1,6.34,7.73,7.97,8.27,8.87,9.23,9.65,10.31,10.55,10.79]},{"t":"從現在到感恩節，只有十天，妳趕快決定吧！","a":12.55,"b":19.69,"c":[12.63,12.93,13.23,13.71,14.19,14.37,14.61,15.45,15.75,16.05,16.41,17.41,17.77,18.07,18.55,18.79,19.09]},{"t":"我想請不能回家的外國朋友來我家，大家一起過節比較熱鬧。","a":20.49,"b":32.04,"c":[20.57,20.81,21.11,21.89,22.19,22.55,22.85,23.15,23.63,23.87,24.29,24.59,25.37,25.79,26.09,27.47,27.71,28.31,28.55,29.03,29.21,30.05,30.29,30.77,31.01]},{"t":"太好了！我可以參加嗎？最近工作很忙，沒時間回家過節。","a":32.83,"b":43.16,"c":[32.91,33.27,33.69,34.88,35.24,35.48,35.78,36.02,36.38,37.8,38.04,38.52,38.7,39.0,39.31,40.29,40.53,40.77,41.25,41.55,41.97,42.15]},{"t":"非常歡迎！我要做很多菜，怕時間來不及。妳可以早一點來幫忙嗎？","a":43.96,"b":57.0,"c":[44.04,44.28,44.82,45.0,46.5,46.68,46.98,47.52,47.82,48.12,49.49,50.03,50.33,50.93,51.17,51.41,52.89,53.19,53.43,54.03,54.39,54.63,55.11,55.59,55.83,56.13]},{"t":"沒問題。妳可以請每個朋友帶一點吃的東西，這樣 ,116.2,116.5,116.74,116.92,117.79,117.97,118.33,118.57,118.93,119.23,119.47]},{"t":"這些茶的名字真有趣！你是在哪裡買的？","a":121.1,"b":127.89,"c":[121.18,121.42,121.84,122.2,122.56,122.74,123.28,123.76,124.0,125.29,125.53,125.89,126.31,126.73,127.03,127.39]},{"t":"這些茶不是在這裡買的，是我從臺灣帶來的。臺灣茶的品質非常好，妳喝喝看就知道了。味道怎麼樣？","a":128.44,"b":145.65,"c":[128.52,128.7,129.0,129.54,129.84,130.14,130.56,130.86,131.1,131.4,132.23,132.65,132.95,133.43,133.61,134.09,134.33,134.63,136.19,136.37,136.73,137.03,137.45,137.63,138.35,138.53,138.83,139.97,140.27,140.63,140.81,141.23,141.59,141.83,142.07,143.7,143.88,144.42,144.72,144.9]},{"t":"嗯……，喝起來有一點苦，有一點甜，很特別。","a":146.45,"b":155.84,"c":[146.53,148.41,148.65,148.89,149.55,149.97,150.21,150.57,151.8,152.16,152.34,152.7,154.15,154.57,154.81]},{"t":"這次妳喝的是味道比較淡，可是比較香的茶，要是有機會，我請妳喝味道濃一點的東方美人茶。","a":156.38,"b":170.62,"c":[156.46,156.64,157.18,157.54,157.84,158.02,158.5,158.68,159.04,159.22,159.52,160.32,160.56,161.04,161.22,161.52,161.88,162.12,163.48,163.66,163.9,164.2,164.44,165.29,165.59,165.77,166.07,166.55,166.73,167.27,167.45,167.63,167.93,168.47,168.65,169.13,169.31,169.61]}],"audio":"audio/v3/L05.mp3"},{"n":6,"title":"同事對我很好","lines":[{"t":"喂，家文，是我。爸媽都好嗎？","a":0.8,"b":6.67,"c":[0.88,2.55,2.73,3.78,4.08,5.19,5.37,5.67,5.91,6.21]},{"t":"我們一切都好。你呢？工作怎麼樣？","a":7.39,"b":13.57,"c":[7.47,7.65,8.25,8.43,8.91,9.15,10.05,10.35,11.54,11.72,12.26,12.5,12.68]},{"t":"我剛來的時候很忙，工作常常沒做完。不過，現在已經適應了。","a":14.37,"b":23.69,"c":[14.45,14.69,14.93,15.17,15.35,15.59,15.89,16.19,17.19,17.37,17.91,18.09,18.45,18.69,18.93,20.17,20.29,20.95,21.31,21.85,22.09,22.45,22.75,23.05]},{"t":"哇！你的壓力一定很大。","a":24.49,"b":28.53,"c":[24.57,25.51,25.81,26.05,26.35,27.01,27.19,27.49,27.79]},{"t":"還好同事們都很熱心，願意幫我忙。","a":29.33,"b":34.78,"c":[29.41,29.53,30.01,30.19,30.43,30.85,31.15,31.51,31.75,32.81,32.99,33.41,33.65,33.95]},{"t":"聽起來你的同事對你很好啊！","a":35.58,"b":39.95,"c":[35.66,35.9,36.08,36.8,37.1,37.4,37.64,38.18,38.54,38.84,39.08,39.44]},{"t":"是啊！如果我有聽不懂或看不懂的資料，也都是同事幫忙一起解決的。","a":40.75,"b":51.31,"c" 去跟一家貿易公司談合作的事。","a":18.3,"b":27.55,"c":[18.38,18.74,19.1,19.4,19.76,20.0,21.31,21.49,21.91,22.21,22.51,22.99,23.41,23.59,24.07,24.25,24.67,24.85,25.57,25.99,26.23,26.53,26.77]},{"t":"你們談得怎麼樣？","a":28.34,"b":30.87,"c":[28.42,28.66,29.14,29.38,29.8,30.1,30.28]},{"t":"談得很順利。我們兩家公司已經談好了，也決定以後怎麼合作了。","a":31.67,"b":42.28,"c":[31.75,32.0,32.36,32.78,33.08,34.33,34.45,34.81,35.11,35.47,35.65,36.31,36.61,37.15,37.39,37.69,38.63,38.93,39.23,39.71,39.95,40.37,40.67,41.03,41.27,41.57]},{"t":"希望你們公司發展得越來越好。","a":43.06,"b":48.33,"c":[43.14,43.32,43.68,43.92,44.28,44.46,45.24,45.48,45.84,46.38,46.68,47.1,47.34]},{"t":"我們公司的老闆希望以後能在德國投資，開分公司。","a":49.13,"b":57.94,"c":[49.21,49.39,49.81,50.05,50.35,50.65,50.89,51.85,52.09,52.69,52.87,53.47,53.83,54.31,54.49,54.97,55.21,56.18,56.54,56.84,57.08]},{"t":"妳會不會說德文？","a":58.63,"b":61.67,"c":[58.71,59.07,59.43,59.61,59.97,60.57,60.81]},{"t":"不會，我只聽得懂幾句話。我是用英文跟他們溝通的。","a":62.46,"b":71.55,"c":[62.54,62.78,64.05,64.35,64.77,65.07,65.25,65.79,66.03,66.33,67.45,67.81,68.11,68.59,68.77,69.31,69.61,69.91,70.39,70.57,70.87]},{"t":"工作做完了以後，妳去哪裡看親戚？","a":72.2,"b":77.96,"c":[72.28,72.46,72.88,73.18,73.42,73.66,73.9,74.84,75.08,75.38,75.74,76.1,76.76,77.0]},{"t":"我去法國找我阿姨，有兩年多沒看到她和表妹了。","a":78.74,"b":87.04,"c":[78.82,79.18,79.6,79.84,80.38,80.68,81.16,81.34,82.59,82.89,83.19,83.43,84.03,84.33,84.57,84.87,85.35,85.77,86.01,86.31]},{"t":"妳阿姨住的地方離德國遠嗎？","a":87.7,"b":92.57,"c":[87.78,88.2,88.38,88.86,89.04,89.34,89.52,90.24,90.84,91.02,91.44,91.8]},{"t":"不遠。我從德國搭火車到阿姨家，才兩個多小時。","a":93.26,"b":102.53,"c":[93.34,93.52,95.2,95.56,96.04,96.28,96.82,97.18,97.48,97.96,98.44,98.62,98.92,100.02,100.5,100.74,101.1,101.34,101.64]},{"t":"聽說歐洲大城市的交通很方便，出門坐地鐵或是坐公車都很容易。","a":103.24,"b":113.39,"c":[103.32,103.5,104.34,104.52,104.94,105.24,105.42,105.72,106.02,106.2,106.68,107.04,107.34,108.43,108.55,108.85,109.21,109.39,109.99,110.23,110.59,110.95,111.13,111.67,112.03,112.45,112.69]},{"t":"是啊！搭火車就可以從一個國家到其他國家。","a":114.15,"b":122.91,"c":[114.23,115.15,116.06,116.36,116.66,117.32,117.68,118.04,118.58,119.12,119.3,119.6,119.84,120.56,121.1,121.34,121.7,121.94]},{"t":"我對歐洲的文化有興趣，要是以後有機會去歐洲旅行，一定先請教妳。","a":123.65,"b":134.42,"c":[123.73,123.91,124.33,124.57,124.81,125.05,125.23,125.77,126.07,126.31,127.51,127.69,127.99,128.17,128.65,128.95,129.19,129.61,130.15,130.39,130.69,130.87,131.65,131.89,132.25,132.91,133.15,133.45]},{"t":"沒問題，我會好好地給你介紹一些好玩的地方。","a":135.22,"b":143.15,"c":[135.3,135.6,135.9,137.39,137.69,138.17,138.41,138.74,139.07,139.37,139.91,140.09,140.45,140.63,141.35,141.53,141.89,142.13,142.37]}],"audio":"audio/v3/L07.mp3"},{"n":8,"title":"我做錯事了","lines":[{"t":"家安，妳怎麼了？看起來心情不太好。","a":0.75,"b":7.6,"c":[0.83,1.07,2.12,2.48,2.78,2.96,4.17,4.47,4.65,5.37,5.61,6.15,6.45,6.75]},{"t":"我昨天在公司被經理罵了。","a":8.4,"b":13.17,"c":[8.48,8.84,9.14,9.68,10.16,10.34,11.06,11.72,11.84,12.32,12.62]},{"t":"發生了什麼事？","a":13.78,"b":15.94,"c":[13.86,14.16,14.34,14.7,15.0,15.24]},{"t":"唉！我昨天沒看清楚資料，寫錯了合約上面的價錢。","a":16.68,"b":26.11,"c":[16.76,18.29,18.65,18.95,19.49,19.85,20.27,20.51,21.05,21.29,22.25,22.67,22.97,23.39,23.63,24.05,24.29,24.59,24.95,25.19]},{"t":"問題很嚴重嗎？","a":26.89,"b":29.3,"c":[26.97,27.15,27.69,28.11,28.35,28.65]},{"t":"還好我給經理看的時候，他發現我多寫了一個零。","a":30.1,"b":38.2,"c":[30.18,30.36,31.08,31.38,31.92,32.1,32.4,32.7,32.94,33.18,34.2,34.56,34.86,35.52,35.88,36.3,36.66,36.96,37.14,37.5]},{"t":"哇！他生氣了吧？","a":38.98,"b":41.57,"c":[39.06,39.9,40.26,40.56,40.86,40.98]},{"t":"他很生氣，所以罵了我一頓。","a":42.37,"b":47.29,"c":[42.45,42.81,43.23,43.65,44.55,44.91,45.45,45.69,45.93,46.23,46.53]},{"t":"我了解妳的感覺，做錯事一定讓妳很不舒服。","a":48.09,"b":55.16,"c":[48.17,48.41,48.65,49.01,49.31,49.49,49.73,50.81,51.05,51.35,52.2,52.38,52.62,52.86,53.28,53.64,54.0,54.3]},{"t":"是啊！相當難過，如果我小心一點就不會發生這種問題了。","a":55.68,"b":65.9,"c":[55.76,56.12,57.08,57.38,57.8,58.04,59.44,59.68,60.1,60.46,60.76,61.18,61.36,62.37,62.61,62.85,63.27,63.51,63.99,64.17,64.53,64.77,65.13]},{"t":"別難過了。我也有這樣的經驗。","a":66.55,"b":70.99,"c":[66.63,66.93,67.23,67.47,68.38,68.68,68.92,69.22,69.52,69.82,70.18,70.36]},{"t":"你做錯了什麼事？","a":71.79,"b":74.52,"c":[71.87,72.23,72.65,72.95,73.25,73.49,73.73]},{"t":"有一次，老闆讓我翻譯一份資料，我要交給他的時候，發現存在電腦裡面的檔案不見了。我來不及再做一份，就被老闆罵了一頓。","a":75.32,"b":95.03,"c":[75.4,75.7,75.88,76.96,77.14,77.56,77.86,78.22,78.4,78.76,78.94,79.36,79.54,80.64,80.82,81.24,81.48,81.72,81.96,82.14,82.5,83.52,83.76,84.42,84.72,85.2,85.38,85.74,85.98,86.22,86.52,86.76,87.36,87.6,87.96,89.11,89.47,89.71,89.89,90.37,90.67,90.97,91.15,91.97,92.21,92.57,92.81,93.35,93.65,93.83,94.07]},{"t":"現在大家都用電腦工作，雖然很方便，可是也很容易發生問題。","a":95.73,"b":106.36,"c":[95.81,96.11,96.65,96.89,97.25,97.55,97.97,98.15,98.69,98.81,99.96,100.2,100.62,100.98,101.28,102.26,102.5,103.1,103.46,103.88,104.12,104.6,104.84,105.2,105.44]},{"t":"我現在給老闆資料以前，一定多檢查幾次，要不然工作可能就沒了。","a":107.15,"b":117.67,"c":[107.23,107.47,107.83,108.37,108.85,109.03,109.45,109.63,109.93,110.11,111.03,111.15,111.51,111.99,112.29,112.59,112.83,113.78,113.96,114.14,114.86,115.04,115.64,115.94,116.18,116.42,116.72]},{"t":"對，每份資料都要看得很清楚，也要認真地檢查。","a":118.47,"b":127.26,"c":[118.55,119.85,120.03,120.45,120.63,121.29,121.65,121.95,122.31,122.67,123.09,123.33,124.43,124.73,125.09,125.39,125.75,126.11,126.35]}],"audio":"audio/v3/L08.mp3"},{"n":9,"title":"週末的活動","lines":[{"t":"我回來了。何希，你在哪裡？","a":0.81,"b":6.61,"c":[0.89,1.31,1.67,1.91,3.46,3.76,4.87,5.17,5.59,5.95]},{"t":"我在樓上書房。","a":7.41,"b":10.11,"c":[7.49,7.73,8.21,8.45,8.99,9.23]},{"t":"請你下來，我有事跟你說。","a":10.91,"b":16.1,"c":[10.99,11.29,11.71,12.01,13.23,13.59,13.95,14.49,14.85,15.15]},{"t":"我在整理資料，妳上來吧。","a":16.91,"b":21.43,"c":[16.99,17.23,17.71,18.01,18.49,18.73,19.65,20.01,20.37,20.61]},{"t":"我姊姊說她下個星期要去紐約出差，沒有人幫她照顧孩子，想請我們照顧一下。","a":22.22,"b":37.32,"c":[22.3,22.6,22.9,23.2,24.42,24.78,25.2,25.44,25.68,26.4,26.76,27.36,27.54,27.96,28.14,29.6,29.78,30.08,30.62,30.92,31.52,31.76,32.12,32.36,33.77,34.31,34.67,34.97,35.81,36.11,36.47,36.71]},{"t":"孩子們是週末來我們家吧？","a":38.0,"b":41.91,"c":[38.08,38.32,38.56,38.98,39.52,39.7,40.06,40.48,40.78,41.02,41.38]},{"t":"是。他們來這裡會不會讓你覺得麻煩？","a":42.71,"b":50.86,"c":[42.79,44.61,44.85,45.15,45.51,45.81,47.01,47.31,47.55,48.09,48.45,48.87,49.29,49.59,49.95]},{"t":"不會。但是我們每個週末都要打掃房子，就讓他們一起幫忙吧。","a":51.66,"b":62.02,"c":[51.74,51.98,53.1,53.28,53.88,54.12,54.48,54.72,55.02,55.26,55.74,56.04,56.46,56.76,57.18,57.42,58.47,58.65,58.95,59.25,59.85,60.03,60.57,60.75,61.05]},{"t":"沒問題，Frank平常就喜歡幫他爸爸割草。有Nicole幫忙，那些畫跟照片，我就可以拿下來好好地擦一擦。","a":62.58,"b":82.99,"c":[62.66,62.96,63.26,64.56,65.85,66.03,66.63,67.11,67.41,68.13,68.49,68.91,69.27,69.69,69.87,71.53,72.07,72.61,72.79,74.19,74.43,74.73,75.21,75.69,75.87,77.0,77.24,77.6,77.9,78.38,78.69,79.04,80.17,80.47,80.89,81.31,81.73,82.03]},{"t":"我們打掃完了，在院子烤肉，好不好？","a":83.79,"b":89.73,"c":[83.87,84.05,84.47,84.77,85.13,85.37,86.14,86.68,86.86,87.28,87.58,88.57,88.81,88.99]},{"t":"孩子們一定喜歡烤肉，他們可以幫忙把烤肉的東西拿出去。","a":90.53,"b":101.62,"c":[90.61,90.79,90.97,91.69,91.93,92.47,92.71,93.19,93.49,94.95,95.13,95.49,95.73,96.27,96.51,97.61,98.21,98.57,98.81,99.05,99.29,100.01,100.43,100.67]},{"t":"週末都在家有一點無聊，我們星期天帶他們出去玩玩吧！","a":102.42,"b":111.82,"c":[102.5,102.68,103.04,103.28,103.58,104.18,104.54,104.72,105.14,105.32,106.49,106.61,107.09,107.33,107.57,108.29,108.65,108.95,109.43,109.67,110.21,110.57,110.87]},{"t":"好啊！上午去附近的小山玩玩。我們爬上去，在山上看看風景再慢慢地走下來，大概要兩個多小時。","a":112.62,"b":133.9,"c":[112.7,112.94,114.47,114.77,115.19,115.91,116.09,116.33,116.57,116.87,117.41,117.71,119.9,120.08,120.56,120.86,121.16,122.62,123.16,123.4,124.06,124.54,125.02,125.2,126.56,127.1,127.4,127.82,128.24,128.54,128.96,130.45,130.69,131.23,131.77,132.07,132.43,132.73,133.03]},{"t":"下個週末社區好像有棒球比賽，下山以後，我們就帶他們去看比賽。","a":134.67,"b":145.58,"c":[134.75,135.05,135.35,135.53,136.19,136.43,137.03,137.27,137.63,138.11,138.35,138.71,138.95,140.2,140.5,140.86,141.04,141.76,142.06,142.36,142.72,143.08,143.38,143.74,144.16,144.58,144.82]},{"t":"好，Frank非常喜歡打棒球。","a":146.38,"b":152.34,"c":[146.46,147.72,148.97,149.27,149.63,149.93,150.47,151.01,151.31]},{"t":"我想我們這樣安排，會讓他們很開心。","a":153.14,"b":159.12,"c":[153.22,153.4,153.94,154.24,154.6,154.9,155.26,155.44,156.22,156.52,156.82,157.12,157.6,158.02,158.32]}],"audio":"audio/v3/L09.mp3"},{"n":10,"title":"我的中文進步了","lines":[{"t":"各位同學，這個學期快要結束了。我把最後一次考試的考卷還給大家，請你們仔細地看看。","a":0.8,"b":17.54,"c":[0.88,1.06,1.48,1.72,3.31,3.49,3.79,4.03,4.63,4.93,5.35,5.71,6.01,7.67,7.91,8.39,8.69,9.11,9.35,10.13,10.49,10.85,11.15,11.39,12.41,12.65,12.95,13.25,14.68,14.98,15.22,15.76,16.12,16.36,16.6,16.96]},{"t":"哇！好緊張，不知道我考得怎麼樣。","a":18.34,"b":24.72,"c":[18.42,19.62,20.04,20.22,21.51,21.69,21.87,22.23,22.59,23.01,23.49,23.79,24.03]},{"t":"妳是最用功的學生，放心吧。","a":25.52,"b":30.05,"c":[25.6,25.9,26.32,26.86,27.04,27.28,27.58,27.88,28.85,29.15,29.45]},{"t":"這學期開始的時候，我記得自己常常寫錯字。這次我只寫錯了兩個字，聽力跟寫字的能力都進步了，真開心！","a":30.84,"b":51.4,"c":[30.92,31.28,31.58,32.18,32.48,32.78,33.02,33.26,34.67,34.97,35.27,35.63,35.93,36.83,37.07,37.49,37.85,38.21,39.66,39.96,40.93,41.11,41.47,41.89,42.19,42.79,43.09,43.39,44.85,45.09,45.51,45.81,46.23,46.59,46.83,47.01,47.61,48.21,48.45,48.75,49.82,50.24,50.54]},{"t":"我覺得漢字太難寫了，說話比較容易。現在我說得比以前流利，也能說更長的句子。","a":52.2,"b":67.04,"c":[52.28,52.52,52.82,53.3,53.48,54.14,54.62,54.92,55.28,56.2,56.5,57.16,57.4,57.7,57.94,59.26,59.56,60.38,60.68,61.04,61.46,62.0,62.24,62.72,62.9,63.86,64.04,64.34,64.94,65.3,65.66,65.9,66.14]},{"t":"我最近常常出差，沒有太多的時間寫作業，所以考得不太好。但是我認識的字比以前多了，聲調也比以前正確了。","a":67.84,"b":89.01,"c":[67.92,68.28,68.58,69.18,69.36,69.9,70.08,71.21,71.45,71.87,72.17,72.41,72.65,72.95,73.37,73.79,74.15,75.57,75.87,76.41,76.77,77.07,77.37,77.73,79.81,80.11,81.06,81.36,81.66,81.96,82.2,82.74,83.16,83.4,83.82,84.18,85.35,85.53,86.07,86.37,86.73,86.97,87.63,87.93,88.29]},{"t":"你們上課都很認真，考試的成績也不錯，只要繼續學習，你們的中文一定越來越好。","a":89.81,"b":105.68,"c":[89.89,90.13,90.43,90.79,91.33,91.75,92.11,92.41,93.82,94.06,94.42,94.66,94.96,95.5,95.86,96.1,97.56,97.8,98.4,98.7,99.06,99.36,100.76,101.0,101.3,101.6,101.78,102.74,102.98,103.65,104.0,104.6,104.84]},{"t":"我很喜歡學中文，學中文不但有趣，而且很有用，我會努力地學習。","a":106.48,"b":118.45,"c":[106.56,106.86,107.16,107.46,107.88,108.42,108.66,109.82,110.3,110.48,111.02,111.2,111.56,111.8,112.71,112.95,113.55,113.91,114.21,115.39,115.63,116.23,116.53,116.83,117.13,117.49]},{"t":"我同意杜翔的想法。我的主管告訴我，因為我會說中文，所以公司可能把我派到臺灣去工作。","a":119.25,"b":137.03,"c":[119.33,119.81,120.11,120.83,121.07,121.43,121.73,122.03,123.69,123.93,124.29,124.47,125.07,125.25,125.61,127.11,127.29,127.59,127.95,128.25,128.85,129.03,130.5,130.74,131.8,131.98,132.4,132.7,133.0,133.3,134.02,134.38,134.98,135.22,135.7,136.18,136.36]},{"t":"如果妳去臺灣，可以一邊工作，一邊學中文，妳的中文一定會進步得很快。","a":137.59,"b":149.99,"c":[137.67,137.91,138.33,138.75,139.23,139.41,140.39,140.63,141.23,141.47,141.95,142.13,143.13,143.31,143.73,144.21,144.45,145.56,145.8,146.1,146.28,147.06,147.24,147.54,148.14,148.32,148.62,148.92,149.22]},{"t":"沒錯，臺灣是一個很適合學中文的地方，有很好的老師和學校。","a":150.79,"b":162.74,"c":[150.87,151.11,152.83,153.01,153.37,153.73,153.91,154.63,155.05,155.41,155.95,156.61,156.85,157.15,157.39,157.57,158.93,159.41,159.71,160.01,160.31,160.55,161.27,161.69,161.99]},{"t":"我聽說臺灣不但有很多好玩的地方，也有很多特別的小吃，而且臺灣人對外國人很友善。","a":163.47,"b":178.18,"c":[163.55,163.85,164.15,165.29,165.47,165.95,166.13,166.43,166.85,167.15,167.81,167.99,168.35,168.53,168.71,169.76,169.88,170.24,170.48,171.14,171.44,171.74,171.92,172.16,173.37,173.55,174.39,174.57,174.81,175.17,175.65,175.89,176.13,176.61,177.09,177.33]},{"t":"聽起來真不錯，我希望能有機會去臺灣看看。","a":178.98,"b":187.39,"c":[179.06,179.36,179.54,180.02,180.44,180.74,182.26,182.56,182.8,183.4,183.7,184.06,184.36,185.02,185.68,185.92,186.34,186.64]}],"audio":"audio/v3/L10.mp3"}]},{"lessons":[{"n":1,"title":"我要到臺灣去","lines":[{"t":"莉亞，午安。對不起，我遲到了。","a":0.85,"b":5.52,"c":[1.34,1.64,1.94,2.12,3.26,3.44,3.62,4.37,4.73,4.97,5.27]},{"t":"沒關係，我也剛到。","a":6.56,"b":8.9,"c":[6.6,6.84,7.02,7.74,7.98,8.28,8.52]},{"t":"妳約我喝咖啡，要跟我談事情嗎？","a":10.0,"b":13.57,"c":[9.9,10.26,10.44,10.68,10.92,11.16,11.64,12.0,12.24,12.48,12.84,13.08,13.32]},{"t":"是啊！我告訴你一個好消息，我們公司要派我去臺灣工作。","a":14.61,"b":23.15,"c":[14.57,14.93,15.9,16.26,16.44,16.74,17.04,17.22,17.52,17.76,18.0,19.08,19.32,19.56,19.74,20.22,20.58,20.88,21.36,21.96,22.14,22.62,22.8]},{"t":"哇！恭喜妳。妳終於有機會去臺灣看看了。","a":24.39,"b":30.67,"c":[24.42,25.38,25.56,25.86,26.7,27.12,27.36,27.78,28.14,28.44,28.86,29.34,29.52,29.88,30.12,30.42]},{"t":"雖然去臺灣讓我很興奮，但是有點緊張，不知道我能不能適應那裡的工作跟生活。","a":31.68,"b":44.04,"c":[31.78,32.02,32.38,32.74,32.92,33.58,33.82,34.06,34.42,34.72,35.62,35.98,36.4,36.64,37.06,37.3,38.44,38.68,38.92,39.34,39.76,40.0,40.18,40.6,40.84,41.38,41.56,41.8,42.22,42.4,42.88,43.3,43.54]},{"t":"放心，妳一定很快就適應了。我請我弟弟家文去機場接妳吧。","a":45.09,"b":53.97,"c":[45.14,45.44,46.16,46.52,46.64,47.12,47.36,47.72,48.02,48.38,48.56,49.88,50.24,50.54,50.78,51.08,51.38,51.68,52.1,52.64,52.82,53.24,53.48,53.72]},{"t":"好啊！這樣我就不擔心會迷路了。","a":54.99,"b":59.54,"c":[55.03,55.33,56.23,56.47,56.89,57.07,57.37,57.67,57.91,58.27,58.81,58.99,59.29]},{"t":"你們公司打算派妳去多久？","a":60.56,"b":64.19,"c":[60.54,60.84,61.08,61.26,61.74,62.04,62.46,62.7,63.0,63.42,63.72]},{"t":"半年。不過，公司說如果有需要的話，希望我多留半年。","a":65.24,"b":74.19,"c":[65.33,65.51,66.95,67.13,67.97,68.15,68.45,69.23,69.47,69.77,70.19,70.37,70.61,70.73,71.69,71.87,72.29,72.71,73.13,73.55,73.73]},{"t":"妳到臺灣以後，除了工作，還有什麼計畫？","a":74.99,"b":80.24,"c":[74.91,75.21,75.63,75.81,76.11,76.29,77.07,77.31,77.67,77.85,78.51,78.69,79.05,79.35,79.77,79.95]},{"t":"我最想試試看臺灣特別的小吃，也想把有名的地方都看一看。","a":81.29,"b":89.86,"c":[81.21,81.63,81.93,82.23,82.59,82.83,83.43,83.61,84.09,84.33,84.57,84.87,85.11,86.25,86.55,86.85,87.45,87.57,87.75,87.99,88.11,88.59,88.95,89.25,89.43]},{"t":"那麼，我給妳介紹一位臺灣同事，她的個性跟妳很像，很活潑也很熱心，一定願意帶妳到處去玩玩。","a":90.89,"b":104.78,"c":[90.88,91.12,91.72,92.02,92.32,92.68,92.86,93.22,93.4,93.82,94.0,94.36,94.6,95.44,95.8,96.1,96.34,96.82,97.12,97.48,97.72,98.44,98.8,98.98,99.52,99.88,100.24,100.48,101.32,101.5,101.8,101.98,102.52,102.82,103.24,103.42,103.78,104.08,104.32]},{"t":"太好了！如果公司同意的話，我還想去學中文。","a":105.85,"b":112.35,"c":[105.82,106.12,106.42,107.62,107.8,108.1,108.28,108.7,108.94,109.18,109.36,109.96,110.32,110.56,110.92,111.22,111.7,111.88]},{"t":"我請家文幫妳打聽一下，應該可以找到適合妳的學校和中文課。","a":113.42,"b":121.52,"c":[113.38,113.62,113.98,114.34,114.82,115.0,115.36,115.6,115.9,116.02,116.86,117.04,117.34,117.58,117.94,118.18,118.6,118.84,119.08,119.32,119.56,119.8,120.22,120.7,120.88,121.18]},{"t":"謝謝你替我安排這些事，你真是我的好朋友。","a":122.57,"b":128.96,"c":[122.68,122.92,123.16,123.52,123.76,124.18,124.42,124.78,124.96,125.2,126.22,126.64,127.0,127.36,127.6,127.96,128.26,128.5]},{"t":"不客氣，朋友應該互相幫忙。我希望妳對臺灣留下美好的印象。","a":130.13,"b":139.64,"c":[130.12,130.42,130.72,131.86,132.04,132.52,132.7,133.12,133.3,133.6,133.78,135.14,135.5,135.74,136.28,136.58,136.94,137.06,137.54,137.84,138.32,138.5,138.8,139.1,139.34]}],"audio":"audio/v4/L01.mp3"},{"n":2,"title":"歡迎你來臺灣","lines":[{"t":"高莉亞，妳好。歡迎妳來臺灣！","a":0.85,"b":5.63,"c":[0.96,1.34,1.72,2.1,2.4,3.78,3.96,4.2,4.62,4.98,5.16]},{"t":"家文，謝謝你來機場接我。讓你等這麼久，真不好意思。","a":6.1,"b":15.46,"c":[6.15,7.14,8.34,8.64,8.94,9.18,9.66,9.84,10.26,10.44,11.81,12.05,12.35,12.71,12.95,13.19,13.91,14.33,14.63,14.87,15.11]},{"t":"沒關係。妳所有的行李都在這裡吧，推車看起來有點重，我推吧！","a":16.64,"b":26.08,"c":[16.67,16.91,17.21,18.41,18.83,19.07,19.31,19.61,19.79,20.15,20.39,20.69,20.93,21.17,22.37,22.67,23.09,23.33,23.51,23.81,23.99,24.29,25.29,25.53,25.83]},{"t":"謝謝，麻煩你了。坐了十幾個小時的飛機，還有時差，我累得不得了。","a":27.06,"b":37.93,"c":[27.12,27.42,28.44,28.68,28.98,29.22,30.54,30.9,31.26,31.62,31.92,32.16,32.46,32.7,32.94,33.18,34.08,34.32,34.74,34.98,35.88,36.3,36.72,37.02,37.26,37.5]},{"t":"妳餓不餓？要不要先吃點東西再去臺北？","a":39.08,"b":44.53,"c":[39.01,39.37,39.67,39.85,41.13,41.37,41.49,41.79,42.09,42.33,42.69,42.87,43.41,43.77,44.13,44.25]},{"t":"我在飛機上吃得很飽，現在一點都不餓，只是有點渴，我想買瓶水。不過我沒有臺幣，得先在機場換一點錢。","a":45.58,"b":63.61,"c":[45.5,45.8,46.28,46.52,46.76,47.18,47.45,47.72,48.08,48.98,49.34,49.82,50.0,50.36,50.6,50.84,51.88,52.18,52.6,52.84,53.2,54.16,54.52,54.88,55.24,55.48,56.86,57.16,57.64,58.06,58.36,58.78,59.08,60.04,60.52,60.88,61.42,61.6,62.14,62.44,62.68,63.04]},{"t":"機場換錢很方便，從這裡往前走，然後右轉就看到銀行了。","a":64.66,"b":73.12,"c":[64.77,64.95,65.31,65.55,65.97,66.21,66.45,67.71,68.01,68.31,68.73,68.97,69.27,70.17,70.47,70.71,70.89,71.43,71.73,72.03,72.45,72.57,72.87]},{"t":"請妳在這個出口等一下，我去停車場把車開過來。","a":74.07,"b":80.86,"c":[74.09,74.39,74.81,75.17,75.41,75.65,75.83,76.25,76.49,76.67,77.75,78.05,78.53,78.71,78.89,79.37,79.67,80.09,80.33,80.51]},{"t":"從桃園機場到臺北遠不遠？","a":81.96,"b":86.43,"c":[82.01,82.73,83.06,83.39,83.51,83.99,84.53,84.71,85.43,85.67,85.91]},{"t":"不遠。桃園也在臺灣的北部，如果不塞車的話，開車一個小時左右就到了。除了開車，還可以搭巴士或是機場捷運。","a":87.48,"b":104.81,"c":[87.54,87.72,89.16,89.43,89.7,89.94,90.42,90.54,90.84,91.08,91.26,92.7,92.88,93.24,93.54,93.84,94.08,94.26,95.28,95.58,96.12,96.3,96.48,96.72,97.08,97.26,97.5,97.74,97.98,99.28,99.52,99.7,99.94,101.02,101.32,101.56,101.92,102.22,102.46,103.0,103.24,103.78,103.96,104.44,104.56]},{"t":"沒想到這麼近，也有這麼多交通工具，真方便！","a":105.84,"b":112.86,"c":[105.87,106.11,106.41,106.95,107.19,107.43,108.39,108.69,109.11,109.41,109.59,110.13,110.31,110.73,110.85,111.74,112.16,112.46]},{"t":"到了臺北以後，我先送妳去旅館，讓妳休息一下。","a":113.91,"b":120.62,"c":[113.85,114.09,114.51,114.69,115.05,115.23,116.37,116.67,116.91,117.21,117.51,117.87,118.05,118.95,119.25,119.61,119.85,120.15,120.33]},{"t":"謝謝你幫我訂好了旅館，讓我省了很多時間，你真細心。","a":121.67,"b":130.14,"c":[121.77,122.07,122.31,122.79,123.03,123.36,123.69,123.99,124.23,124.41,125.5,125.74,126.04,126.34,126.7,126.94,127.3,127.6,128.44,128.92,129.34,129.64]},{"t":"不客氣。妳是我哥哥的好朋友，而且是第一次來臺灣，一定要好好地接待妳啊！","a":131.19,"b":142.21,"c":[131.15,131.39,131.69,132.94,133.24,133.54,133.9,134.14,134.32,134.68,134.92,135.16,136.24,136.48,136.84,137.26,137.5,137.68,138.04,138.4,138.52,139.74,139.86,140.1,140.52,140.76,141.06,141.36,141.54,141.78,141.96]}],"audio":"audio/v4/L02.mp3"},{"n":3,"title":"我租的公寓不錯","lines":[{"t":"莉亞，我是家文。妳搬好家了嗎？","a":0.85,"b":5.38,"c":[0.9,1.2,1.5,1.74,2.1,2.46,3.6,4.08,4.32,4.62,4.92,5.1]},{"t":"已經搬好了。有公司同事幫忙，一切都沒問題。","a":6.57,"b":14.14,"c":[6.6,6.78,7.32,7.56,7.8,9.06,9.6,9.78,10.32,10.5,10.86,11.04,12.12,12.3,12.78,13.08,13.38,13.62]},{"t":"妳租的房子怎麼樣？","a":15.19,"b":17.3,"c":[15.13,15.49,15.67,15.97,16.15,16.63,16.87,16.99]},{"t":"雖然那棟大樓外面看起來有點舊，可是我租的公寓裡面整理得很乾淨，我覺得不錯。","a":18.49,"b":32.1,"c":[18.55,18.79,19.39,19.63,20.05,20.23,20.59,20.83,21.55,21.85,22.09,22.51,22.81,23.29,24.25,24.55,25.15,25.63,25.87,26.35,26.53,26.83,27.07,27.88,28.12,28.45,28.78,29.2,29.38,30.4,30.76,31.06,31.42,31.66]},{"t":"妳住在幾樓？有幾個房間？","a":33.29,"b":37.58,"c":[33.22,33.64,33.82,34.18,34.42,35.98,36.4,36.7,36.94,37.18]},{"t":"我住在六樓，有客廳和兩個房間，還有廚房跟浴室，我一個人住剛好。","a":38.79,"b":51.18,"c":[38.74,39.22,39.46,39.94,40.18,41.51,41.99,42.29,42.89,43.37,43.67,43.91,44.21,45.41,45.65,46.19,46.37,46.91,47.63,47.75,48.83,49.37,49.55,49.73,50.03,50.57,50.75]},{"t":"六樓不錯，如果電梯壞了，走樓梯上去不太累，哈！哈！附近環境怎麼樣？","a":52.23,"b":63.81,"c":[52.32,52.5,52.86,52.98,54.25,54.49,54.91,55.15,55.51,55.75,56.77,57.19,57.43,57.79,58.03,58.57,58.87,59.23,60.13,60.43,61.78,61.9,62.44,62.62,63.1,63.4,63.52]},{"t":"公寓在巷子裡面，很安靜。另外，買東西也很方便，走出巷子就到大馬路，從巷子口往左轉，再走幾步路，就有便利商店跟超市，我需要的東西都買得到。","a":64.86,"b":90.5,"c":[64.98,65.22,65.58,66.0,66.24,66.48,66.66,67.57,67.99,68.17,69.37,69.61,70.45,70.81,70.99,71.41,71.77,72.19,72.43,73.63,73.93,74.23,74.47,75.01,75.31,75.73,76.03,76.27,77.53,78.13,78.43,78.67,79.15,79.51,79.81,80.73,81.03,81.51,81.75,82.11,83.07,83.43,84.03,84.21,84.63,84.75,85.29,85.77,86.01,87.27,87.75,87.99,88.23,88.47,88.65,89.25,89.73,89.97,90.15]},{"t":"聽起來不錯。房租貴不貴？","a":91.55,"b":95.26,"c":[91.62,91.86,92.1,92.46,92.64,93.92,94.16,94.58,94.82,95.0]},{"t":"我覺得不算貴。家具都是新的，再加上電視、冰箱都有，每個月租金兩萬五千塊錢。","a":96.31,"b":110.28,"c":[96.25,96.55,96.91,97.27,97.57,97.99,99.25,99.49,100.03,100.27,100.63,100.87,102.01,102.49,102.73,103.27,103.51,104.41,104.59,105.07,105.31,106.5,106.68,106.92,107.46,107.64,108.31,108.6,108.96,109.33,109.62,109.81]},{"t":"房租包括水費、電費嗎？房東幫妳裝好網路了嗎？","a":111.33,"b":118.31,"c":[111.44,111.67,112.09,112.27,112.63,112.94,113.59,113.83,114.13,115.53,115.72,116.14,116.31,116.73,116.91,117.39,117.57,117.87,118.06]},{"t":"房租不包括水費、電費。房東已經把網路裝好了，但是網路費我得自己付。","a":119.31,"b":131.61,"c":[119.43,119.73,120.09,120.39,120.63,121.05,121.35,122.07,122.31,123.63,123.81,124.23,124.47,124.71,125.19,125.37,125.85,126.03,126.33,127.47,127.77,128.61,128.79,129.15,129.75,130.05,130.59,130.83,131.25]},{"t":"附近交通方便嗎？","a":132.66,"b":134.87,"c":[132.88,133.0,133.54,133.66,134.08,134.32,134.56]},{"t":"大馬路上有公車，離捷運站也不太遠，去上班很方便。","a":136.09,"b":144.85,"c":[136.24,136.48,136.84,137.02,137.38,137.86,138.1,139.12,139.72,139.96,140.2,140.68,141.04,141.34,141.58,142.54,142.96,143.2,143.74,144.16,144.4]},{"t":"聽起來妳對住的地方很滿意。以後需要我幫忙的話，一定要跟我說，別客氣。","a":145.9,"b":156.19,"c":[145.93,146.23,146.41,146.83,147.07,147.49,147.61,147.85,148.03,148.39,148.75,148.99,150.37,150.55,150.97,151.15,151.39,151.75,151.93,152.23,152.41,153.37,153.55,153.79,153.97,154.21,154.39,155.17,155.53,155.83]},{"t":"謝謝你的關心。等我把房子整理好了，再請你來我家坐坐。","a":157.24,"b":166.66,"c":[157.36,157.66,158.02,158.32,158.62,158.8,160.19,160.43,160.85,161.33,161.51,161.99,162.17,162.47,162.77,163.55,164.03,164.27,164.81,165.17,165.53,165.95,166.25]}],"audio":"audio/v4/L03.mp3"},{"n":4,"title":"捷運又快又方便","lines":[{"t":"莉亞，這是幫妳帶回來的豆漿和蛋餅。妳午餐只吃這些嗎？","a":0.85,"b":9.67,"c":[0.9,1.2,1.5,1.8,2.22,2.46,2.76,3.0,3.24,3.48,3.9,4.14,4.62,5.1,5.34,6.6,7.26,7.5,7.98,8.4,8.82,9.06,9.42]},{"t":"我不太餓，這些夠了。你買了什麼？","a":10.69,"b":17.17,"c":[10.65,11.13,11.43,11.79,12.87,13.23,13.77,14.07,15.34,15.76,16.12,16.42,16.78]},{"t":"雞腿便當，妳看，很豐富吧？","a":18.22,"b":23.12,"c":[18.42,18.6,19.2,19.38,20.52,20.76,21.83,22.25,22.55,22.85]},{"t":"聞起來很香，改天我吃吃看。","a":24.36,"b":29.3,"c":[24.35,24.71,24.95,25.43,25.73,26.99,27.29,27.77,28.25,28.61,28.85]},{"t":"聽說妳家離公司不遠，妳每天怎麼來上班？","a":30.35,"b":37.36,"c":[30.35,30.65,31.31,31.67,32.09,32.57,32.75,33.23,33.41,34.44,34.74,35.04,35.64,36.0,36.24,36.66,36.96]},{"t":"我平常搭捷運。上班快遲到了，我才搭計程車。","a":38.41,"b":46.5,"c":[38.32,38.92,39.1,39.64,40.12,40.36,41.68,41.98,42.4,42.94,43.12,43.42,44.2,44.56,44.92,45.52,45.76,46.0]},{"t":"妳搭哪一條路線？要轉車嗎？","a":47.55,"b":52.39,"c":[47.52,47.88,48.24,48.54,48.78,49.32,49.5,50.88,51.42,51.72,52.14]},{"t":"我搭綠線，搭四站就到公司了，不必轉車。我非常喜歡臺灣的捷運，不但班次多，而且車票不算貴。","a":53.43,"b":70.41,"c":[53.38,53.8,54.4,54.58,55.84,56.26,56.56,57.1,57.34,57.7,57.94,58.24,59.15,59.39,59.81,60.11,61.49,62.09,62.39,62.75,62.99,63.65,63.83,64.13,64.61,64.79,65.93,66.11,66.59,66.77,67.13,67.91,68.15,68.69,68.87,69.41,69.65,70.07]},{"t":"是啊！大家都認為捷運又快又方便。如果妳會騎自行車的話，也可以騎自行車來。","a":71.46,"b":85.96,"c":[71.46,71.88,73.2,73.5,73.8,74.16,74.4,75.18,75.42,75.9,76.26,76.74,77.16,77.4,78.88,79.06,79.54,79.84,80.26,80.86,81.04,81.34,81.7,81.88,82.95,83.31,83.55,83.97,84.51,84.75,85.05,85.41]},{"t":"騎自行車？可是我沒有自行車啊！","a":87.01,"b":92.76,"c":[87.05,87.71,87.89,88.19,89.75,90.05,90.65,91.07,91.37,91.79,91.97,92.15,92.51]},{"t":"妳在捷運站外面看到很多自行車吧？那些都可以租的，很受歡迎。","a":93.78,"b":104.88,"c":[93.74,94.04,94.64,94.82,95.12,95.54,95.78,96.44,96.8,97.28,97.58,98.12,98.3,98.6,98.96,99.99,100.53,101.07,101.49,101.79,102.21,102.45,103.35,103.59,104.25,104.43]},{"t":"你說的是那些黃色的自行車？難怪很多人一出捷運站就去騎車，我還覺得很奇怪呢！","a":105.93,"b":119.39,"c":[105.84,106.14,106.5,106.92,107.34,107.64,108.18,108.36,108.66,109.14,109.32,109.62,111.3,111.48,112.02,112.2,112.5,113.1,113.34,113.76,114.0,114.24,114.78,115.14,115.56,115.74,116.89,117.13,117.43,117.73,118.09,118.57,118.81,119.11]},{"t":"用悠遊卡就可以租，妳明天可以試試看。","a":120.44,"b":127.02,"c":[120.42,121.02,121.26,121.5,122.04,122.46,122.76,123.12,123.96,124.44,124.68,125.22,125.58,125.94,126.3,126.66]},{"t":"這裡有很多汽車、摩托車，我覺得騎自行車有點危險。","a":128.07,"b":136.67,"c":[128.04,128.34,128.64,129.06,129.36,129.78,130.02,130.86,131.04,131.28,132.51,132.75,133.05,133.53,134.07,134.25,134.55,135.21,135.51,135.93,136.17]},{"t":"只要妳慢慢地騎，注意旁邊的摩托車，就不會有問題。","a":137.72,"b":145.67,"c":[137.75,137.99,138.29,138.83,139.07,139.37,139.67,140.81,140.99,141.35,141.53,141.83,142.25,142.43,142.73,143.51,143.93,144.23,144.53,144.83,145.07]},{"t":"捷運很方便，為什麼還有那麼多人騎摩托車？","a":146.72,"b":153.42,"c":[146.86,147.1,147.52,147.82,148.12,149.26,149.44,149.68,150.22,150.46,150.88,151.06,151.3,151.54,152.02,152.5,152.74,153.04]},{"t":"摩托車更方便啊！想去哪裡就去哪裡，完全不必走路。在臺灣，摩托車是最普遍的交通工具。","a":154.47,"b":169.4,"c":[154.58,154.76,155.0,155.54,155.96,156.2,156.5,157.64,158.0,158.36,158.6,159.08,159.44,159.74,159.98,160.94,161.12,161.6,161.84,162.2,162.44,163.76,164.18,164.36,165.2,165.38,165.68,166.16,166.7,167.12,167.42,167.78,168.26,168.44,168.86,169.04]},{"t":"這個情形跟大部分美國人出門常開車一樣，都是為了方便。","a":170.45,"b":179.09,"c":[170.39,170.69,170.99,171.17,171.77,172.31,172.55,172.73,173.27,173.45,173.75,174.35,174.59,175.13,175.43,175.67,176.03,176.21,177.12,177.42,177.96,178.2,178.44,178.68]}],"audio":"audio/v4/L04.mp3"},{"n":5,"title":"夜市好熱鬧","lines":[{"t":"莉亞，我是芳宜。明文請我帶妳去逛夜市，妳後天有空嗎？","a":0.85,"b":9.9,"c":[0.94,1.24,1.96,2.26,2.9,3.54,4.18,4.36,4.78,4.96,5.32,5.56,5.92,6.28,6.58,6.76,7.9,8.26,8.5,8.98,9.22,9.58]},{"t":"好啊！我在美國就常聽明文提到夜市，早就想去逛逛了。","a":10.95,"b":20.11,"c":[10.98,11.22,12.42,12.72,13.08,13.32,13.8,14.4,14.58,15.12,15.24,15.84,16.08,16.62,16.8,17.76,18.18,18.54,18.84,19.32,19.62,19.86]},{"t":"那麼，後天下午五點，捷運中山站６號出口見，妳方便嗎？","a":21.15,"b":29.06,"c":[21.12,21.36,22.19,22.37,22.73,22.91,23.27,23.45,24.41,24.59,25.01,25.13,25.37,26.09,26.51,26.69,27.05,27.77,28.19,28.43,28.73]},{"t":"可以，我會準時到的。","a":30.11,"b":33.33,"c":[30.14,30.38,31.34,31.64,32.06,32.36,32.78,33.08]},{"t":"妳看，前面有很多商店和攤販的地方就是夜市。","a":34.38,"b":41.55,"c":[34.42,34.72,35.87,36.11,36.47,36.77,37.01,37.43,37.61,38.15,38.51,38.75,38.99,39.23,39.41,40.13,40.55,40.97,41.09]},{"t":"哇！好多人，沒想到這麼熱鬧。","a":42.6,"b":47.89,"c":[42.66,43.8,44.1,44.4,45.54,45.84,46.14,46.68,46.92,47.28,47.52]},{"t":"對臺灣人來說，逛夜市算是一種休閒活動，大部分的人都喜歡。","a":48.94,"b":57.94,"c":[48.9,49.32,49.5,49.74,50.04,50.22,51.24,51.54,51.72,52.26,52.62,52.98,53.22,53.7,53.88,54.3,54.54,55.62,55.8,56.04,56.28,56.46,56.88,57.24,57.54]},{"t":"夜市為什麼這麼吸引人？","a":58.99,"b":62.58,"c":[59.14,59.32,59.98,60.16,60.46,60.94,61.18,61.78,61.96,62.14]},{"t":"因為夜市有各式各樣的小吃、飲料、衣服跟日用品。來吃晚飯、吃消夜，或是買東西都很方便。再加上，價錢都不算貴，所以不管誰都喜歡。","a":63.63,"b":86.93,"c":[63.75,63.93,64.53,64.71,65.19,65.61,65.85,66.15,66.33,66.57,66.81,67.05,68.07,68.31,69.15,69.39,70.11,70.59,70.89,71.07,72.51,72.81,73.17,73.41,74.13,74.43,74.73,75.67,75.91,76.33,76.69,76.93,77.59,77.95,78.31,78.55,79.69,80.11,80.35,81.13,81.43,81.91,82.21,82.45,82.75,83.71,84.07,84.85,85.03,85.33,85.87,86.23,86.47]},{"t":"哇！那個老闆賣的雞排好大，比我的臉還大，我要吃吃看。","a":87.98,"b":97.84,"c":[88.06,89.38,89.68,89.92,90.16,90.58,90.88,91.36,91.54,91.96,92.26,93.28,93.7,94.0,94.24,94.72,95.02,96.04,96.34,96.82,97.18,97.42]},{"t":"夜市的雞排炸得又酥又脆，算是最受歡迎的小吃。","a":98.89,"b":105.77,"c":[98.98,99.16,99.4,99.7,99.88,100.6,100.87,101.14,101.5,101.86,102.1,103.07,103.43,103.85,104.09,104.51,104.69,104.87,105.11,105.29]},{"t":"咦！我聞到一個奇怪的味道，是什麼啊？","a":106.82,"b":113.13,"c":[106.84,108.22,108.64,108.88,109.24,109.42,109.96,110.2,110.5,110.74,110.98,111.82,112.3,112.6,112.84]},{"t":"是臭豆腐。臭豆腐聞起來臭臭的，吃起來一點也不臭，妳敢不敢嚐嚐看？","a":114.18,"b":125.38,"c":[114.13,114.61,114.97,115.21,116.59,116.89,117.13,117.49,117.73,117.91,118.45,118.75,118.99,119.83,120.19,120.43,121.09,121.27,121.69,121.93,122.17,123.13,123.61,123.85,124.03,124.57,124.87,125.05]},{"t":"臭豆腐這麼有名，我當然要試試。嗯，吃起來酥酥的，味道還不錯，沒有聞起來那麼臭，難怪臺灣人喜歡。","a":126.43,"b":144.6,"c":[126.47,126.89,127.13,127.61,127.85,128.27,128.45,129.29,129.77,130.01,130.37,130.67,131.03,132.29,133.73,134.03,134.21,134.69,134.99,135.23,136.19,136.37,136.85,137.15,137.39,138.69,138.87,139.29,139.59,139.83,140.31,140.55,140.79,142.17,142.41,143.01,143.13,143.43,143.85,144.09]},{"t":"那個攤販賣木瓜牛奶，它跟珍珠奶茶一樣，也是很多人喜歡的，要不要喝喝看？","a":145.65,"b":157.08,"c":[145.62,145.92,146.16,146.4,146.88,147.42,147.6,147.96,148.2,149.22,149.64,150.0,150.24,150.54,150.78,151.08,151.2,152.13,152.37,152.85,153.09,153.33,153.75,153.99,154.29,155.43,155.67,155.91,156.27,156.51,156.75]},{"t":"我太愛珍珠奶茶了，幾乎每天都喝一杯，今天我喝木瓜牛奶吧。","a":158.13,"b":168.3,"c":[158.02,158.44,158.86,159.34,159.58,159.94,160.18,160.42,161.74,161.92,162.28,162.52,162.94,163.3,163.66,163.9,165.05,165.23,165.89,166.25,166.79,167.03,167.51,167.75,168.05]},{"t":"夜市一個晚上是逛不完的，妳以後想什麼時候來就什麼時候來，再慢慢地逛。","a":169.29,"b":180.96,"c":[169.36,169.75,170.14,170.32,170.62,170.8,171.22,171.64,171.82,172.06,172.3,173.62,174.1,174.28,174.88,175.36,175.6,175.84,176.08,176.32,177.13,177.55,177.73,177.97,178.15,178.45,179.29,179.83,180.13,180.37,180.61]}],"audio":"audio/v4/L05.mp3"},{"n":6,"title":"臺北的特色","lines":[{"t":"高莉亞已經在臺北住了四個多月了，不管生活、工作都算是適應了。","a":0.71,"b":12.07,"c":[0.8,1.18,1.56,1.94,2.18,2.48,3.08,3.26,3.98,4.16,4.52,5.0,5.36,5.6,5.96,7.27,7.51,7.93,8.11,9.01,9.19,10.08,10.32,10.74,11.22,11.58,11.82]},{"t":"雖然高莉亞早就知道臺灣跟美國不一樣，但是她沒想到臺北還有很多特別的情形。","a":13.1,"b":27.37,"c":[13.17,13.41,13.95,14.29,14.63,14.97,15.33,15.63,15.93,16.77,16.95,17.43,17.85,18.09,18.69,19.05,19.29,20.43,20.79,21.27,21.75,22.05,22.35,23.29,23.47,23.95,24.19,24.61,24.91,25.51,25.75,26.11,26.53,26.71]},{"t":"首先，在臺北會看到不同的建築，有中式的、日式的或是西式的，高莉亞聽說這跟臺灣的歷史有關係。","a":28.42,"b":46.62,"c":[28.46,28.76,29.96,30.56,30.74,31.28,31.76,32.06,32.6,32.78,33.14,33.56,33.74,35.24,35.9,36.02,36.38,37.58,37.82,38.18,38.6,38.9,39.62,39.74,40.1,41.47,41.75,42.03,42.31,42.55,43.15,43.51,44.05,44.23,44.53,44.83,45.01,45.61,46.03,46.27]},{"t":"除了傳統的建築，也有現代的，最有名的就是臺北101大樓。","a":47.67,"b":57.98,"c":[47.72,47.96,48.44,48.62,49.04,49.58,49.76,50.72,51.02,51.56,51.8,52.16,53.36,53.78,54.02,54.32,54.74,55.04,55.7,55.88,57.32,57.56]},{"t":"觀光客幾乎都會到最高一層樓去看看風景。","a":59.1,"b":65.89,"c":[59.24,59.48,59.72,60.5,60.68,61.1,61.52,61.82,62.24,62.54,62.9,63.08,63.32,63.92,64.46,64.82,65.3,65.48]},{"t":"晚上，從上往下看，五顏六色的燈光讓臺北變得更美了。","a":66.94,"b":76.43,"c":[67.04,67.22,68.18,68.42,69.08,69.32,69.74,71.06,71.3,71.66,71.9,72.14,72.44,72.62,73.49,73.97,74.15,74.75,75.05,75.41,75.77,76.13]},{"t":"臺北還有很多值得去參觀的地方，像博物館跟寺廟。","a":77.48,"b":86.98,"c":[77.65,77.89,78.55,78.79,79.15,79.51,80.17,80.41,80.83,81.37,81.67,81.91,82.21,82.45,83.89,84.67,84.85,85.09,85.69,86.35,86.59]},{"t":"在博物館，可以看到很多古物。","a":88.03,"b":92.79,"c":[87.99,88.65,88.77,89.01,89.85,90.15,90.45,90.75,91.35,91.59,92.25,92.49]},{"t":"在寺廟，能欣賞傳統建築的特色，也能了解華人的宗教信仰。","a":93.84,"b":104.24,"c":[93.79,94.45,94.69,95.47,96.07,96.25,96.91,97.09,97.75,97.93,98.23,98.53,98.83,99.88,100.18,100.66,100.84,101.68,101.86,102.1,102.64,102.82,103.54,103.72]},{"t":"除了各式各樣的建築，還有一個讓高莉亞覺得非常有趣的現象，就是到處可以看到餐廳跟飲料店。","a":105.29,"b":122.02,"c":[105.32,105.56,106.04,106.28,106.82,107.06,107.3,107.78,107.96,109.16,109.46,109.82,110.0,110.54,111.2,111.56,111.92,112.28,112.64,113.18,113.36,113.9,114.08,114.5,114.8,115.1,116.56,116.86,117.46,117.7,118.18,118.42,118.72,119.02,119.56,119.74,120.4,121.24,121.42,121.66]},{"t":"而且總是有人在門口排隊，等著進去吃飯、等著外帶飲料。","a":123.07,"b":132.71,"c":[123.05,123.35,124.19,124.49,124.79,125.09,125.57,126.11,126.29,126.83,127.07,128.09,128.45,128.81,129.05,129.47,129.71,130.72,131.08,131.44,131.68,132.22,132.46]},{"t":"這個情形讓高莉亞覺得，「吃美食」對臺灣人來說，是非常重要的一件事。","a":133.76,"b":145.35,"c":[133.7,134.0,134.36,134.54,135.26,135.92,136.22,136.52,136.82,137.06,137.96,138.44,138.68,139.52,140.24,140.42,140.72,141.08,141.32,141.98,142.7,142.94,143.48,143.72,144.02,144.44,144.68,144.98]},{"t":"高莉亞還發現，跟很多大城市比起來，臺北是一個很安全的城市。","a":146.4,"b":156.82,"c":[146.45,146.77,147.09,147.41,147.71,147.95,148.79,149.39,149.63,150.17,150.47,150.65,151.25,151.55,151.85,152.99,153.23,153.77,154.07,154.25,154.67,155.15,155.33,155.75,156.11,156.35]},{"t":"她晚上可以去逛夜市，可以跟同事喝酒，玩到半夜才回家都沒問題。","a":157.74,"b":169.92,"c":[157.61,158.27,158.45,158.99,159.29,159.59,160.25,160.61,160.79,161.9,162.2,162.5,163.04,163.34,164.24,164.54,165.62,165.98,166.4,166.64,167.06,167.42,167.66,168.14,168.62,168.98,169.28]},{"t":"臺北路上車很多，交通有點亂，但是臺灣人很友善，生活也很方便，高莉亞認為臺北是一個適合居住的城市。","a":170.97,"b":190.82,"c":[171.11,171.29,171.77,171.95,172.49,172.91,173.21,174.52,174.7,175.3,175.6,175.96,176.98,177.28,178.0,178.12,178.42,179.02,179.56,179.74,180.76,181.06,181.66,182.02,182.5,182.74,184.12,184.54,184.96,185.38,185.56,186.16,186.34,187.0,187.42,187.6,188.2,188.5,189.22,189.4,189.7,190.12,190.36]}],"audio":"audio/v4/L06.mp3"},{"n":7,"title":"臺灣人喜歡的休閒活動","lines":[{"t":"莉亞，我是芳宜。這個週末妳想不想去看棒球比賽？","a":0.85,"b":8.47,"c":[0.9,1.2,1.5,1.74,2.52,3.3,3.8,4.1,4.4,4.58,5.18,5.54,5.84,6.08,6.5,6.8,7.28,7.52,7.88,8.12]},{"t":"我從來沒看過，沒想到妳喜歡看棒球比賽。","a":9.52,"b":17.13,"c":[9.41,10.07,10.37,10.79,11.15,11.51,12.89,13.13,13.43,14.03,14.45,14.75,15.17,15.83,16.07,16.49,16.73]},{"t":"我本來不愛看，因為我男朋友是棒球迷，只要有比賽就會約我去看，後來我就慢慢地喜歡看了。","a":18.18,"b":32.87,"c":[18.14,18.56,18.8,19.16,19.4,19.58,20.78,21.02,21.32,21.62,21.86,22.1,22.52,22.88,23.18,23.36,24.56,24.92,25.22,25.46,25.76,26.54,26.9,27.26,27.44,27.74,27.98,29.18,29.42,30.02,30.32,30.86,31.16,31.49,31.82,32.0,32.3,32.54]},{"t":"我跟何希也常常去看運動比賽。我喜歡看網球比賽，他喜歡看美式足球比賽。","a":33.92,"b":47.49,"c":[33.84,34.14,34.56,35.01,35.46,36.06,36.3,36.72,37.02,37.56,37.8,38.16,38.46,39.72,40.2,40.5,40.98,41.64,41.88,42.3,42.6,43.68,44.28,44.52,44.88,45.48,45.66,46.32,46.5,46.86,47.1]},{"t":"我知道世界上最多人喜歡的運動是足球，但是在臺灣，棒球和籃球是比較受歡迎的運動。","a":48.54,"b":61.89,"c":[48.46,48.82,49.0,49.72,50.02,50.26,50.86,51.16,51.4,51.7,51.94,52.18,52.42,52.66,53.08,53.5,53.68,54.88,55.3,55.66,56.08,56.26,57.52,57.76,58.18,58.54,58.72,59.38,59.86,60.04,60.28,60.76,60.88,61.12,61.36,61.54]},{"t":"我前幾天經過一個運動場，聽見裡面有很多人大聲地喊著加油，是不是棒球比賽？","a":62.94,"b":76.48,"c":[62.89,63.31,63.61,63.91,64.69,64.87,65.29,65.47,65.89,66.13,66.37,67.45,67.75,68.11,68.29,68.89,69.37,69.67,70.03,70.63,70.87,71.29,71.71,72.01,72.31,72.55,73.81,74.11,74.41,75.07,75.37,75.79,76.09]},{"t":"應該是吧。看比賽的時候，又喊又叫，很過癮。不管自己喜歡的球隊贏了或是輸了，看球賽都是很有意思的休閒活動。","a":77.53,"b":94.81,"c":[77.64,77.88,78.12,78.42,79.68,80.1,80.28,80.52,80.64,80.88,81.6,82.08,82.5,82.8,83.46,83.94,84.12,85.32,85.56,85.92,86.16,86.46,86.64,86.88,87.18,87.36,87.78,87.96,88.56,88.8,89.16,89.4,90.36,90.72,90.96,91.56,91.86,92.16,92.46,92.82,93.06,93.3,93.66,93.84,94.2,94.44]},{"t":"我們也是。除了看球賽，週末晚上我們還喜歡跟朋友去酒吧喝酒，一邊喝酒，一邊聊天，會暫時忘記工作的壓力。","a":95.86,"b":115.14,"c":[95.81,96.11,96.41,96.77,98.33,98.57,98.93,99.41,99.65,100.91,101.09,101.45,101.63,102.5,102.68,102.92,103.22,103.52,104.0,104.48,104.78,105.2,105.8,105.98,106.4,106.64,108.14,108.32,108.68,108.98,109.94,110.12,110.48,110.72,111.68,112.22,112.46,113.0,113.18,113.84,114.08,114.32,114.62,114.8]},{"t":"在臺灣去酒吧喝酒不是那麼普遍，喜歡去KTV唱歌的人比較多。","a":116.19,"b":126.0,"c":[116.11,116.59,116.77,117.37,117.85,118.03,118.33,118.57,119.35,119.59,119.95,120.13,120.43,120.67,121.93,122.17,122.59,123.22,123.85,124.03,124.33,124.51,125.05,125.29,125.59]},{"t":"我常聽見同事提到去唱歌，臺灣人怎麼這麼愛唱歌啊？","a":127.05,"b":135.57,"c":[126.97,127.51,127.81,128.05,128.65,128.83,129.55,129.85,130.15,130.51,130.75,132.26,132.44,132.74,133.28,133.58,133.88,134.12,134.42,134.72,135.02,135.32]},{"t":"在KTV唱唱自己喜歡的流行歌曲，會讓人心情變得很輕鬆。另外，如果有人唱得非常好聽，聽他們唱歌也是一種享受。","a":136.59,"b":155.43,"c":[136.52,137.39,138.26,138.5,138.86,139.04,139.4,139.58,139.88,140.36,140.54,140.96,141.14,142.1,142.46,142.64,143.3,143.48,143.96,144.2,144.56,144.98,145.16,146.74,146.92,147.82,148.0,148.36,148.6,148.96,149.35,149.74,149.98,150.34,150.58,151.66,152.02,152.26,152.5,152.74,153.4,153.82,154.18,154.42,154.78,155.02]},{"t":"我不會唱中文歌，不能跟你們一起去，好可惜啊！","a":156.48,"b":164.06,"c":[156.44,156.86,157.16,157.52,158.12,158.3,158.6,159.64,159.88,160.24,160.54,160.78,161.26,161.44,161.74,162.7,163.18,163.42,163.72]},{"t":"KTV裡面也有外國歌，英文的、日文的都有。","a":165.92,"b":171.87,"c":[165.67,165.97,166.15,166.75,167.11,167.53,167.71,168.01,169.21,169.39,169.63,170.41,170.59,170.89,171.25,171.49]},{"t":"真的？太好了！改天我要去KTV看看。","a":173.08,"b":179.95,"c":[173.04,173.4,174.36,174.72,175.08,176.34,176.58,177.18,177.48,177.72,178.5,179.28,179.58]}],"audio":"audio/v4/L07.mp3"},{"n":8,"title":"參加結婚典禮","lines":[{"t":"國成，我收到黃小姐的喜帖，她請我參加她的結婚典禮。","a":0.85,"b":10.06,"c":[0.96,1.26,2.52,3.0,3.24,3.84,4.08,4.38,4.68,5.04,5.22,6.24,6.72,6.96,7.5,7.74,8.1,8.4,8.82,9.0,9.48,9.66]},{"t":"我也收到了。妳會去喝喜酒吧？","a":11.11,"b":15.92,"c":[11.05,11.41,11.89,12.13,12.43,13.21,13.63,13.99,14.41,15.01,15.25,15.67]},{"t":"我從來沒參加過華人的婚禮，當然會去。我應該送禮物還是送紅包呢？","a":16.92,"b":28.43,"c":[16.85,17.39,17.63,17.99,18.35,18.65,18.89,19.67,19.79,20.03,20.27,20.45,21.53,21.71,22.01,22.31,23.68,24.1,24.34,24.7,25.18,25.48,26.32,26.62,27.04,27.58,27.82,28.18]},{"t":"送禮物可以，不過大部分的人會送紅包。","a":29.44,"b":36.16,"c":[29.51,29.99,30.23,30.65,30.95,31.85,32.15,32.87,33.11,33.35,33.59,33.83,34.43,34.85,35.45,35.75]},{"t":"那麼我也送紅包吧。我聽說送紅包要注意數字，是吧？","a":37.21,"b":45.96,"c":[37.14,37.38,37.92,38.28,38.52,39.0,39.24,39.54,40.68,40.98,41.28,41.94,42.48,42.72,43.14,43.68,43.86,44.4,44.64,45.3,45.66]},{"t":"是，一定要包雙數，而且不可以有「四」這個數字。","a":47.01,"b":55.25,"c":[47.02,48.22,48.4,48.7,49.24,49.66,49.9,50.91,51.15,51.87,52.17,52.47,52.71,53.31,53.97,54.27,54.63,54.87]},{"t":"我早就知道了，在臺灣，「四」不是幸運的數字。臺灣人結婚的時候還有哪些習俗呢？","a":56.3,"b":69.15,"c":[56.26,56.62,56.98,57.28,57.52,57.82,58.96,59.44,59.62,60.52,61.12,61.42,61.96,62.14,62.38,62.68,62.86,64.34,64.52,64.76,65.3,65.48,65.78,65.96,66.2,66.92,67.22,67.52,67.82,68.36,68.54,68.9]},{"t":"從古代起，結婚的習俗就非常複雜，改天我再詳細地給妳介紹。","a":70.15,"b":80.3,"c":[70.15,70.69,70.87,71.23,72.07,72.31,72.55,72.91,73.09,73.63,74.23,74.41,74.89,75.13,76.19,76.49,77.03,77.39,77.87,78.11,78.44,78.77,79.13,79.67,79.91]},{"t":"我經過一家店，看到很多結婚照片，大部分穿著西式禮服，臺灣人現在不喜歡傳統方式了嗎？","a":81.35,"b":96.58,"c":[81.27,81.81,81.99,82.53,82.71,82.89,83.97,84.27,84.75,84.99,85.53,85.71,86.19,86.37,87.81,88.05,88.23,88.77,89.19,89.61,89.79,90.27,90.45,92.07,92.25,92.55,92.85,93.09,93.75,94.11,94.35,95.01,95.19,95.67,95.85,96.21,96.33]},{"t":"有些家庭還是重視傳統的，但是時代不同了，這些傳統習俗也變得越來越簡單。尤其是年輕人，不太在乎傳統習俗了。","a":97.63,"b":117.36,"c":[97.65,97.89,98.19,98.43,99.27,99.51,100.05,100.29,100.83,101.01,101.31,102.29,102.53,103.31,103.67,104.09,104.27,104.57,105.35,105.65,106.19,106.37,106.85,107.03,107.81,108.29,108.59,109.13,109.43,109.85,110.27,110.51,111.83,112.01,112.31,112.85,113.03,113.33,114.29,114.47,114.89,115.19,115.85,116.03,116.57,116.75,117.11]},{"t":"你看，黃小姐穿上新娘禮服好漂亮，新郎也很帥。連同事們都穿得跟平常不太一樣，我幾乎認不出來是誰了。","a":118.39,"b":136.55,"c":[118.37,118.61,119.99,120.29,120.53,121.01,121.19,121.79,121.97,122.39,122.57,123.23,123.65,123.83,125.23,125.41,125.83,126.07,126.37,127.69,128.17,128.41,128.71,129.13,129.61,129.91,130.21,130.69,130.87,131.35,131.53,131.89,132.07,133.15,133.63,133.87,134.35,134.59,134.83,135.07,135.43,135.79,136.21]},{"t":"參加婚禮不可以太隨便，我們都會打扮得正式一點。","a":137.6,"b":145.07,"c":[137.73,137.97,138.39,138.57,139.17,139.47,139.71,140.07,140.37,140.73,141.63,141.87,142.11,142.41,142.83,143.13,143.49,143.85,144.15,144.57,144.75]},{"t":"沒想到臺灣的婚禮這麼熱鬧，為什麼雙方的父母跟新郎新娘要來敬酒？","a":146.12,"b":157.23,"c":[146.17,146.41,146.71,147.61,147.79,148.03,148.33,148.51,149.05,149.29,149.65,149.83,151.11,151.35,151.59,152.19,152.49,152.73,153.03,153.27,153.81,154.47,154.59,155.13,155.25,155.79,156.15,156.63,156.81]},{"t":"敬酒是主人對大家表示感謝，客人也可以在這個時候祝福他們。","a":158.28,"b":168.46,"c":[158.49,158.67,159.21,159.87,160.05,160.41,160.95,161.13,161.67,161.91,162.39,162.57,163.62,163.86,164.34,164.76,165.0,165.3,165.72,165.96,166.2,166.5,167.22,167.4,167.76,168.12]},{"t":"我們就一起去祝福他們「百年好合、早生貴子」吧！","a":169.51,"b":176.87,"c":[169.46,169.76,170.12,170.72,170.9,171.23,171.56,171.68,171.92,172.16,173.18,173.42,173.96,174.14,175.12,175.36,176.08,176.26,176.62]}],"audio":"audio/v4/L08.mp3"},{"n":9,"title":"臺灣的原住民","lines":[{"t":"莉亞，中秋節快到了，放三天假，妳打算做什麼呢？","a":0.85,"b":7.63,"c":[0.9,1.2,1.5,1.74,2.04,2.46,2.76,3.0,3.84,4.14,4.44,4.68,5.46,5.76,6.06,6.48,6.78,7.08,7.26]},{"t":"我要去東部旅行，因為我對臺灣原住民的文化非常有興趣。","a":8.68,"b":18.41,"c":[8.57,8.93,9.23,9.95,10.13,10.61,10.85,12.23,12.41,12.89,13.19,13.79,13.97,14.57,14.85,15.13,15.41,15.65,15.83,16.67,16.97,17.33,17.69,17.99]},{"t":"臺灣東部很值得去看看，不但可以看到原住民的文化，還可以欣賞美麗的太平洋海岸。","a":19.46,"b":31.36,"c":[19.59,19.77,20.19,20.31,20.79,21.09,21.27,21.51,21.81,22.05,23.28,23.46,23.82,24.06,24.3,24.54,25.14,25.44,25.62,25.86,26.04,26.22,27.24,27.54,27.78,28.56,28.74,29.22,29.4,29.58,30.06,30.3,30.48,30.9,31.08]},{"t":"聽說臺灣原住民有很多族群，一共有多少個呢？","a":32.41,"b":40.2,"c":[32.45,32.69,33.59,33.77,34.25,34.55,34.79,35.27,35.75,36.05,36.59,36.71,38.03,38.21,38.57,39.05,39.29,39.65,39.95]},{"t":"原住民一共有十六個族群，他們住在臺灣各地。","a":41.15,"b":47.59,"c":[41.21,41.51,41.75,42.35,42.53,42.83,43.07,43.31,43.61,43.85,44.09,45.11,45.47,45.89,46.07,46.55,46.67,47.03,47.21]},{"t":"各族群的文化有很大的差別嗎？","a":48.64,"b":52.96,"c":[48.78,49.08,49.32,49.56,49.86,50.1,50.82,51.24,51.54,51.84,52.2,52.44,52.68]},{"t":"不同的族群，在語言、文化、風俗習慣上，各有各的特色。最大的族群是阿美族，大部分住在花蓮和臺東。","a":54.01,"b":70.14,"c":[54.03,54.21,54.51,54.81,54.99,55.77,56.49,56.67,57.45,57.69,58.59,58.77,59.13,59.25,59.49,60.51,60.81,61.11,61.23,61.47,61.71,62.96,63.2,63.44,63.74,63.92,64.34,64.88,65.06,65.36,66.74,66.92,67.16,67.7,67.94,68.42,68.6,69.08,69.56,69.8]},{"t":"那麼我去東部旅行的選擇是正確的。下次我應該去哪裡？","a":71.19,"b":80.64,"c":[71.2,71.38,71.98,72.34,72.94,73.12,73.48,73.66,73.9,74.2,74.44,74.98,75.58,75.82,76.18,77.57,77.93,78.59,79.07,79.25,79.61,80.03,80.27]},{"t":"我建議妳去屏東的「臺灣原住民族文化園區」，那裡有原住民的傳統文化和生活方式的展覽，另外還有手工藝教學活動。","a":81.69,"b":99.52,"c":[81.59,82.07,82.31,82.55,82.97,83.51,83.75,83.93,84.71,84.89,85.37,85.64,85.91,86.09,86.57,86.75,87.17,87.35,88.83,89.13,89.43,89.91,90.15,90.39,90.57,91.11,91.29,91.65,91.83,92.42,93.01,93.13,93.55,93.73,93.97,94.27,94.51,95.71,96.01,96.67,96.91,97.33,97.63,97.87,98.35,98.53,98.89,99.13]},{"t":"太好了！我可以順便學一點原住民的手工藝，去了一定有收穫。","a":100.57,"b":111.47,"c":[100.57,100.99,101.29,102.49,102.85,103.09,103.51,103.81,104.23,104.53,104.77,105.49,105.77,106.05,106.33,106.75,107.05,107.29,108.5,108.86,109.46,109.64,110.42,110.78,111.02]},{"t":"妳也可以安排一趟環島旅行。臺灣有名的景點，像阿里山、日月潭、墾丁等，都有不同的原住民部落，而且也有不同的祭典活動。","a":112.52,"b":132.16,"c":[112.41,112.71,113.01,113.25,113.55,113.79,114.09,114.27,114.99,115.11,115.47,115.71,117.27,117.45,117.93,118.11,118.29,118.59,118.71,119.74,120.46,120.64,120.88,121.9,122.14,122.38,123.4,123.7,124.0,124.84,125.14,125.44,125.62,125.86,126.28,126.52,126.76,127.06,127.24,128.26,128.56,129.22,129.52,130.0,130.18,130.48,131.02,131.2,131.56,131.8]},{"t":"我看過一個小島原住民的祭典影片，他們的祭典跟魚有關。","a":133.21,"b":142.19,"c":[133.18,133.48,133.84,134.2,134.32,134.8,135.16,135.64,135.88,136.12,136.36,136.96,137.14,137.62,137.8,138.94,139.24,139.42,139.84,140.17,140.5,141.01,141.52,141.76]},{"t":"那是蘭嶼，在臺灣東邊。那裡的原住民習俗常跟海洋有關，他們做的船也非常漂亮。","a":143.24,"b":156.09,"c":[143.19,143.49,144.04,144.6,145.15,145.57,145.75,146.17,146.29,147.55,147.79,148.03,148.39,148.63,148.81,149.17,149.35,150.19,150.49,150.91,151.09,151.45,151.69,152.77,153.07,153.31,153.55,153.79,154.39,154.93,155.17,155.47,155.71]},{"t":"他們的音樂和舞蹈，都很特別，我非去看看不可！","a":157.14,"b":164.33,"c":[157.08,157.38,157.62,157.98,158.16,158.64,159.06,159.48,159.9,160.26,160.62,160.86,161.88,162.36,162.72,163.08,163.44,163.8,163.92]},{"t":"是啊！妳也可以跟著學學。","a":165.38,"b":169.02,"c":[165.35,165.71,166.49,166.79,167.09,167.33,167.75,167.99,168.23,168.47]}],"audio":"audio/v4/L09.mp3"},{"n":10,"title":"我的臺灣經驗","lines":[{"t":"時間過得好快，一轉眼我在臺北住了快一年了。","a":0.85,"b":8.58,"c":[0.87,1.23,1.77,2.01,2.25,2.55,4.05,4.29,4.53,5.25,5.61,6.09,6.27,6.69,7.11,7.41,7.89,8.07,8.31]},{"t":"這一年，我不但感受到臺灣人的友善和熱情，也有很大的收穫。","a":9.63,"b":18.99,"c":[9.58,9.94,10.18,11.08,11.56,11.74,12.16,12.4,12.7,13.24,13.42,13.72,13.96,14.26,14.44,14.95,15.46,15.64,16.72,17.02,17.5,17.74,18.16,18.4,18.58]},{"t":"來臺灣以前，我有點擔心，怕不能適應亞洲的環境，沒想到一切都很順利。","a":20.04,"b":32.28,"c":[20.02,20.56,20.74,21.1,21.22,22.17,22.53,22.83,23.19,23.49,24.63,25.23,25.47,25.83,26.13,26.55,26.85,27.09,27.39,27.57,29.19,29.43,29.67,30.39,30.57,30.93,31.29,31.65,31.89]},{"t":"在生活上沒問題的原因是臺北很現代化，也很國際化。","a":33.33,"b":41.92,"c":[33.3,33.84,34.02,34.38,34.92,35.22,35.4,35.7,35.94,36.12,36.86,37.52,37.7,38.24,38.78,38.96,39.26,40.1,40.4,41.0,41.18,41.54]},{"t":"這裡有二十四小時營業的便利商店，有賣各種小吃和日用品的夜市，還有賣各國食物的餐廳，讓我吃東西、買東西都很容易。","a":42.97,"b":62.98,"c":[42.87,43.17,43.65,44.37,44.55,44.73,45.09,45.33,45.87,45.99,46.23,46.65,46.89,47.25,47.43,48.87,49.11,49.53,49.77,50.07,50.31,51.09,51.51,51.87,52.05,52.23,52.59,52.71,54.31,54.49,54.97,55.51,55.75,56.17,56.41,56.65,56.89,57.07,58.45,58.75,59.11,59.53,59.77,60.37,60.79,61.03,61.63,62.05,62.41,62.65]},{"t":"另外，我對臺北印象最深刻的就是又乾淨又便宜的捷運，不管去哪裡都很方便。","a":64.03,"b":77.04,"c":[64.09,64.27,65.05,65.41,65.95,66.07,66.67,66.85,67.21,67.51,67.81,68.11,68.92,69.16,69.7,70.24,70.42,71.02,71.5,71.74,71.98,72.46,72.64,73.84,74.08,74.44,74.8,75.1,75.58,76.0,76.36,76.6]},{"t":"除了工作，我總是利用週末或假期去嘗試不同的事情，得到了許多我人生中的第一次經驗。","a":78.09,"b":92.45,"c":[78.17,78.41,78.71,78.89,79.91,80.33,80.63,81.05,81.29,81.65,81.77,82.25,82.67,82.85,83.65,84.19,84.37,84.85,85.09,85.39,85.57,85.81,87.37,87.67,87.91,88.27,88.51,88.99,89.53,89.71,90.07,90.31,90.85,91.09,91.39,91.93,92.11]},{"t":"比方說去逛夜市吃了臭豆腐；去KTV唱了中文歌；去看原住民部落文化，學了舞蹈跟手工藝；去參加婚禮，還包了紅包。","a":93.54,"b":114.29,"c":[93.55,93.73,93.97,94.75,95.23,95.65,95.83,96.49,96.73,97.15,97.51,97.75,99.05,99.89,100.73,100.97,101.45,101.63,101.93,103.29,103.65,104.19,104.43,104.67,105.27,105.45,105.81,105.99,106.95,107.31,107.67,108.03,108.39,108.81,109.05,109.35,110.79,111.33,111.51,111.93,112.11,112.65,113.25,113.43,113.73,113.91]},{"t":"這些難得的經驗給我的人生帶來許多美好的回憶。","a":115.48,"b":122.0,"c":[115.44,115.68,116.22,116.4,116.64,116.88,117.06,117.66,118.08,118.38,118.56,118.74,119.4,119.64,120.0,120.18,120.72,120.9,121.2,121.44,121.62]},{"t":"旅行時，我買了很多紀念品，打算帶回去送給朋友。","a":123.05,"b":130.46,"c":[123.14,123.32,123.56,124.28,124.76,125.0,125.3,125.6,126.08,126.32,126.56,127.57,127.81,128.23,128.53,128.83,129.25,129.55,129.91,130.09]},{"t":"當然我也要帶道地的臺灣茶和鳳梨酥回去讓何希嚐嚐。","a":131.51,"b":139.83,"c":[131.56,131.74,132.52,132.82,133.06,133.24,133.63,134.02,134.26,134.68,134.86,135.16,135.7,136.24,136.54,136.78,137.5,137.8,138.16,138.52,138.88,139.24,139.42]},{"t":"要帶這麼多東西回去，我原來的行李箱一定裝不下，恐怕得再買一個了。","a":140.88,"b":151.24,"c":[140.79,141.09,141.45,141.75,141.93,142.23,142.47,142.77,142.95,144.09,144.69,144.93,145.17,145.59,145.77,145.95,146.49,146.79,147.15,147.39,147.63,148.83,149.07,149.43,149.85,150.21,150.57,150.81,150.99]},{"t":"我剛開始學中文時聽過一句話，「想把語言學好，最好到那個語言環境裡住一段時間。」","a":152.29,"b":165.25,"c":[152.16,152.7,153.0,153.24,153.66,154.08,154.26,154.5,155.34,155.7,156.06,156.3,156.54,158.04,158.4,158.88,159.06,159.48,159.72,160.68,160.98,161.4,161.82,162.0,162.42,162.54,162.96,163.14,163.38,163.98,164.22,164.4,164.7,164.88]},{"t":"來臺灣以後，我發現這句話非常有道理。","a":166.3,"b":171.9,"c":[166.24,166.72,166.9,167.26,167.38,168.16,168.52,168.82,169.24,169.48,169.78,170.38,170.62,170.98,171.28,171.52]},{"t":"一般來說，我天天都能聽到中文，有機會跟別人說中文，所以我的中文不管聽力或是說話，都進步得非常快，這是我當初沒想到的，算是一個意外的收穫吧。","a":172.95,"b":197.65,"c":[172.98,173.1,173.4,173.58,174.24,174.72,175.02,175.44,175.74,175.98,176.28,176.64,176.76,178.14,178.5,178.74,179.1,179.46,179.76,180.12,180.54,180.72,182.04,182.34,182.64,182.94,183.18,183.36,184.2,184.38,184.8,185.04,185.52,185.76,186.12,186.36,187.08,187.68,187.86,188.19,188.52,188.76,189.0,190.5,190.86,191.1,191.52,191.7,192.24,192.54,192.84,193.14,194.34,194.76,195.06,195.24,195.9,196.14,196.38,196.74,197.04,197.4]}],"audio":"audio/v4/L10.mp3"}]},{"lessons":[{"n":1,"title":"住宅的類型","lines":[{"t":"來臺灣的國際朋友，無論是學習還是工作，租房子都是很重要的事。","a":0.9,"b":9.4,"c":[0.9,1.2,1.4,1.7,2.04,2.3,2.56,2.82,3.6,3.78,4.02,4.3,4.56,5.12,5.38,5.66,5.86,6.64,6.9,7.18,7.58,7.76,8.14,8.4,8.66,8.9,9.02]},{"t":"臺灣的房屋類型主要有公寓、華廈、大樓和透天厝，這些房子各有特色，適合不同需求的人。","a":10.09,"b":21.71,"c":[10.09,10.33,10.49,10.77,10.97,11.17,11.33,11.99,12.17,12.41,12.69,12.95,13.59,14.07,14.55,14.85,15.27,15.67,15.93,16.48,17.03,17.25,17.39,17.61,18.15,18.39,18.67,18.85,19.59,19.87,20.21,20.41,20.69,20.89,21.19,21.31]},{"t":"這篇文章說明了這四種房屋類型的特色，讓大家認識一下臺灣的居住環境。","a":22.21,"b":31.15,"c":[22.21,22.39,22.61,22.75,23.31,23.51,23.69,23.95,24.27,24.53,24.89,25.07,25.29,25.55,25.79,26.01,26.21,27.16,27.46,27.68,28.04,28.28,28.5,28.64,29.1,29.4,29.64,29.9,30.24,30.56,30.82]},{"t":"公寓","a":32.24,"b":33.0,"c":[32.24,32.62]},{"t":"公寓有四層或是五層，每一層有兩戶。","a":33.82,"b":39.11,"c":[33.82,34.06,34.44,34.74,35.0,35.54,35.78,36.12,36.38,37.55,37.64,37.73,38.25,38.55,38.81]},{"t":"由於屋齡老，設備比較舊，也沒有電梯，所以公寓的租金比較便宜，適合預算不高的人。","a":39.71,"b":50.64,"c":[39.71,39.95,40.29,40.55,40.79,41.39,41.67,41.95,42.15,42.39,43.05,43.37,43.53,43.73,44.01,44.79,45.01,45.41,45.61,45.85,46.01,46.21,46.75,46.99,47.27,47.51,48.35,48.65,49.07,49.31,49.57,49.85,50.03,50.21]},{"t":"此外，公寓一般都在生活機能良好的地區，附近很容易找到餐廳、便利商店和超市。","a":51.37,"b":61.54,"c":[51.37,51.57,52.17,52.41,52.91,53.07,53.39,53.55,53.97,54.21,54.53,54.69,55.03,55.27,55.57,55.71,55.93,56.73,56.95,57.35,57.57,57.79,58.11,58.33,58.59,58.79,59.39,59.63,59.83,60.05,60.47,60.87,61.13]},{"t":"交通也方便，通常公車站、捷運站都有。","a":61.91,"b":67.12,"c":[61.91,62.15,62.59,62.91,63.09,64.03,64.23,64.73,64.95,65.19,65.71,65.97,66.15,66.53,66.75]},{"t":"不過，公寓的住戶一般要自己處理垃圾，而且公寓停車位少，甚至完全沒有。","a":67.81,"b":77.48,"c":[67.81,67.99,68.65,68.89,69.13,69.27,69.49,69.99,70.15,70.39,70.71,70.97,71.31,71.51,71.93,72.35,72.77,72.99,73.47,73.71,74.11,74.37,74.61,74.85,75.49,75.73,76.17,76.45,76.85,77.05]},{"t":"華廈","a":78.27,"b":78.97,"c":[78.32,78.77]},{"t":"華廈的高度大約是六層到十二層，一定有電梯。","a":79.81,"b":85.9,"c":[79.81,80.01,80.21,80.41,80.57,81.25,81.47,81.65,82.05,82.31,82.79,83.09,83.31,83.55,84.39,84.63,84.99,85.27,85.53]},{"t":"華廈比公寓新，設備比較現代，一般有停車位。","a":86.55,"b":92.83,"c":[86.55,86.92,87.29,87.57,87.79,88.03,88.81,89.05,89.45,89.63,89.85,90.17,90.89,91.07,91.49,91.83,92.09,92.39]},{"t":"有的有垃圾集中處理區，有的沒有。","a":93.29,"b":97.49,"c":[93.29,93.53,93.71,94.02,94.34,94.65,94.91,95.19,95.45,95.63,96.37,96.65,96.89,97.11]},{"t":"租金比公寓高，可是比大樓便宜，適合需要電梯，但是不想付太多房租的人。","a":98.11,"b":108.22,"c":[98.11,98.37,98.71,98.99,99.21,99.45,100.17,100.35,100.81,101.09,101.35,101.65,101.95,102.73,102.97,103.41,103.57,103.85,104.11,104.81,105.05,105.51,105.71,106.01,106.37,106.67,107.01,107.33,107.57,107.69]},{"t":"大樓","a":109.09,"b":109.89,"c":[109.09,109.43]},{"t":"大樓通常超過十層，有電梯、管理員、垃圾處理系統，有些還有健身房、游泳池，甚至連KTV都有。","a":110.57,"b":124.41,"c":[110.57,110.93,111.35,111.53,111.89,112.07,112.35,112.61,113.53,113.89,114.15,114.83,115.05,115.29,115.74,116.2,116.65,116.91,117.11,117.25,118.05,118.27,118.73,118.93,119.21,119.41,119.65,120.29,120.47,120.71,121.73,122.03,122.43,123.08,123.73,124.01]},{"t":"安全管理相當良好，有24小時警衛，住戶需要用門禁卡才能進大樓，甚至到自己住的樓層也得用。","a":125.27,"b":138.45,"c":[125.27,125.49,125.95,126.09,126.45,126.63,126.85,127.11,127.83,128.23,128.85,129.07,129.51,129.79,130.57,130.87,131.39,131.59,131.83,132.09,132.29,132.59,133.11,133.31,133.63,133.93,134.15,134.99,135.29,135.51,135.87,136.11,136.43,136.65,136.79,136.95,137.49,137.79,138.03]},{"t":"但是大樓的管理費高，如果房東不付管理費，住戶就要自己付了。","a":139.33,"b":147.47,"c":[139.33,139.49,140.07,140.33,140.57,140.85,140.99,141.15,141.45,142.35,142.59,142.93,143.19,143.51,143.77,144.13,144.31,144.61,145.25,145.51,145.97,146.15,146.39,146.69,146.99,147.23]},{"t":"重視安全和設備充足，而且預算比較高的人，可以考慮住在大樓裡。","a":148.22,"b":156.84,"c":[148.22,148.5,148.78,148.98,149.54,149.98,150.24,150.5,150.76,151.48,151.66,152.08,152.32,152.72,152.9,153.14,153.4,153.62,154.28,154.46,154.7,154.98,155.38,155.58,155.92,156.18,156.48]},{"t":"透天厝","a":157.85,"b":158.99,"c":[157.85,158.23,159.0]},{"t":"透天厝是獨棟建築，通常是兩層到四層，有獨立的大門、自己的院子和車庫，適合一般家庭居住。","a":159.77,"b":172.62,"c":[159.77,160.03,160.31,160.59,161.03,161.29,161.61,161.89,162.67,162.89,163.13,163.47,163.73,164.25,164.59,164.87,165.63,166.03,166.29,166.47,166.61,166.89,167.57,167.85,168.03,168.17,168.45,168.83,169.13,169.39,170.21,170.47,170.89,171.07,171.39,171.67,172.01,172.27]},{"t":"透天厝的空間大，環境安靜，生活比較自由。","a":173.34,"b":178.72,"c":[173.35,173.61,173.85,174.09,174.29,174.51,174.75,175.35,175.63,176.03,176.23,176.99,177.25,177.65,177.85,178.11,178.25]},{"t":"不過，很多透天厝都在郊區，大眾交通工具少，一般來說，大部分的住戶都自己開車。","a":179.11,"b":190.09,"c":[179.11,179.33,179.93,180.17,180.51,180.75,181.15,181.55,181.83,182.21,182.43,183.47,183.77,184.11,184.31,184.53,184.67,185.03,185.75,185.93,186.13,186.33,187.05,187.35,187.53,187.71,187.91,188.13,188.57,188.87,189.19,189.47,189.73]},{"t":"此外，垃圾也需要住戶自己處理。","a":190.57,"b":194.75,"c":[190.57,190.81,191.28,191.76,192.23,192.49,192.65,192.95,193.19,193.63,193.91,194.21,194.45]},{"t":"希望這篇文章能幫助大家更了解臺灣的居住環境，租房子的時候，每個人可以根據自己的需求選擇最適合自己的房屋。","a":195.97,"b":210.76,"c":[195.98,196.26,196.56,196.72,197.0,197.2,197.74,198.08,198.34,198.6,198.76,199.24,199.52,199.78,200.24,200.48,200.72,201.0,201.32,201.64,201.86,202.78,203.08,203.42,203.6,203.76,203.94,204.6,204.78,204.96,205.44,205.62,205.86,206.04,206.44,206.64,206.88,206.98,207.16,207.88,208.12,208.52,208.82,209.08,209.36,209.62,209.86,210.02,210.28]}],"audio":"audio/v5/L01.mp3"},{"n":2,"title":"建築和生活的改變","lines":[{"t":"臺灣的居住空間和公共建築，隨著社會和科技的發展有了很大的改變，房子不但是人們生活的地方，而且可以看出一個地區的勞動文化和生活方式。","a":0.9,"b":20.22,"c":[0.9,1.2,1.44,1.74,2.04,2.24,2.44,2.94,3.38,3.58,3.86,4.06,5.08,5.33,5.58,5.84,6.28,6.64,6.86,7.1,7.24,7.38,8.1,8.34,8.68,8.94,9.24,9.38,9.6,11.21,11.51,11.91,12.05,12.29,12.57,12.77,13.09,13.31,13.53,13.67,13.83,14.81,15.09,15.47,15.63,15.83,15.97,16.37,16.51,16.71,16.93,17.17,17.41,17.65,17.93,18.11,18.59,19.01,19.25,19.59,19.79]},{"t":"以前，臺灣有很多三合院，這種傳統住宅主要強調大家庭的生活，「三代同堂」的家人住在一起。","a":21.3,"b":34.18,"c":[21.3,21.52,22.4,22.66,22.98,23.28,23.56,23.88,24.1,24.4,25.48,25.76,26.1,26.3,26.62,26.84,27.58,27.8,28.12,28.32,28.74,29.02,29.28,29.52,29.66,29.88,31.24,31.62,31.94,32.2,32.44,32.58,32.8,33.16,33.34,33.6,33.76]},{"t":"三合院看起來像一個「口」的形狀，三面是房屋，中間有一個廣場。","a":35.36,"b":44.41,"c":[35.36,35.66,35.84,36.22,36.44,36.62,37.0,37.3,37.5,37.89,38.28,38.62,38.82,40.14,40.42,40.84,41.1,41.32,42.3,42.56,42.96,43.24,43.4,43.62,43.88]},{"t":"除了收穫的時候可以曬稻穀，平常家人也可以在廣場上一起做很多事情，小孩子在那裡跑來跑去，大人也會在那裡做家事或是跟家人、鄰居喝茶聊天。","a":45.28,"b":66.74,"c":[45.28,45.48,45.76,46.02,46.26,46.4,46.62,46.98,47.14,47.34,47.58,47.8,48.82,49.06,49.38,49.6,50.18,50.46,50.66,50.94,51.22,51.44,51.68,52.18,52.38,52.74,53.08,53.34,53.62,53.82,55.49,55.73,56.03,56.37,56.59,56.81,57.17,57.47,57.73,57.99,59.13,59.43,59.93,60.21,60.51,60.71,60.91,61.17,61.47,61.75,62.47,62.77,63.09,63.39,63.59,64.43,64.73,65.31,65.63,66.05,66.23]},{"t":"日治時期，日本人在臺灣蓋了許多居住用的日式房子，日本式的房子是木造的，蓋的方法和用的材料可以防止潮溼，調節溫度，讓人住起來覺得很舒服。","a":67.85,"b":89.38,"c":[67.86,68.09,68.32,68.58,69.4,69.6,69.84,70.26,70.6,70.78,71.26,71.5,71.7,71.92,72.34,72.58,72.88,73.1,73.44,73.7,74.04,74.3,75.72,75.98,76.22,76.44,76.66,76.86,77.38,77.8,78.06,78.42,79.78,80.04,80.2,80.4,80.98,81.3,81.6,81.76,82.0,82.6,82.78,83.06,83.26,83.58,83.8,84.68,84.98,85.24,85.46,86.42,86.66,87.0,87.18,87.36,87.84,88.08,88.34,88.62,88.86]},{"t":"都市化以後，搬到城市工作的人越來越多，於是有了公寓和大樓。","a":90.86,"b":99.66,"c":[90.86,91.08,91.38,91.64,91.8,92.7,93.0,93.24,93.52,93.86,94.0,94.24,94.36,94.9,95.18,95.46,95.66,96.74,97.04,97.48,97.74,97.94,98.16,98.53,98. 4,"b":60.57,"c":[38.64,38.98,39.14,39.62,39.92,40.18,40.46,40.98,41.18,41.4,41.78,42.06,42.32,42.6,42.84,43.04,43.26,44.04,44.26,44.58,44.9,45.22,45.42,45.64,46.26,46.48,46.78,47.06,47.82,48.08,48.4,48.62,48.84,49.1,50.15,50.53,50.73,50.97,51.41,51.73,51.99,52.29,52.51,52.79,52.93,53.21,53.47,54.31,54.7,55.1,55.49,55.73,56.01,56.27,56.45,57.07,57.47,57.77,58.09,58.29,58.95,59.31,59.61,59.83,60.09]},{"t":"如果打算到平溪放天燈，可以利用臺鐵平溪支線。","a":61.81,"b":68.92,"c":[61.81,61.99,62.29,62.47,63.03,63.41,63.8,64.19,64.53,64.79,65.63,65.81,66.07,66.23,66.67,66.95,67.51,68.02,68.53,69.04]},{"t":"平溪支線原來的目的是運送煤，沒想到現在發展成有重要觀光價值的鐵道支線。","a":69.55,"b":81.04,"c":[69.55,69.88,70.22,70.56,70.89,71.11,71.35,71.57,71.77,72.33,72.73,73.03,73.39,74.54,74.8,75.02,75.66,75.92,76.2,76.4,76.64,77.26,77.62,77.94,78.3,78.54,78.88,79.2,79.44,79.76,80.1,80.42,80.68]},{"t":"這條路線不但有山、水、瀑布等美景，還能感受小鎮的氣氛，非常受觀光客歡迎。","a":81.58,"b":92.58,"c":[81.58,81.82,82.02,82.24,82.78,82.96,83.18,83.44,84.1,84.82,85.16,85.54,85.84,86.12,87.06,87.24,87.62,87.82,88.3,88.6,88.84,89.04,89.26,89.98,90.22,90.52,90.94,91.16,91.46,91.84,92.06]},{"t":"要是你想參觀有名的客家庄，可以在新竹轉內灣支線。","a":93.86,"b":100.98,"c":[93.86,94.1,94.5,94.7,95.04,95.3,95.72,96.02,96.3,96.58,96.84,97.08,97.94,98.16,98.4,98.8,99.06,99.48,99.78,100.03,100.28,100.54]},{"t":"隨著火車慢慢往前走，窗外的風景讓人有回到以前的感覺。","a":101.28,"b":109.64,"c":[101.28,101.57,101.86,102.16,102.7,102.94,103.26,103.48,103.84,104.84,105.14,105.44,105.72,106.04,106.64,106.82,107.34,107.7,108.02,108.3,108.48,108.78,108.94,109.14]},{"t":"還有，來到內灣，當然非嚐嚐客家美食不可，讓肚子也滿載而歸。","a":110.16,"b":119.29,"c":[110.16,110.46,111.18,111.42,111.68,111.9,112.62,112.84,113.2,113.57,113.93,114.3,114.58,114.86,115.12,115.38,115.58,116.38,116.74,116.96,117.48,117.88,118.22,118.54,118.82]},{"t":"連接彰化、南投的集集線是臺鐵最長的支線。","a":120.77,"b":126.44,"c":[120.77,120.99,121.31,121.57,122.03,122.28,122.53,122.81,123.09,123.37,123.97,124.37,124.63,125.03,125.33,125.63,125.85,126.05]},{"t":"這條鐵路當初建造的原因是為了運送日月潭水庫發電需要的機器，後來因為附近有綠色隧道、老街和歷史建築等豐富的觀光資源，越來越有名，
