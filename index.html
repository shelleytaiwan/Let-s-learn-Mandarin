.05,209.37,209.61,209.75,209.97,211.26,211.48,212.18,212.44,212.98,213.22,213.58,213.88,214.12,214.46,214.66,214.86,215.06,215.52,215.78,215.96,216.26,216.48,216.74]},{"t":"計畫一趟火車旅行吧，臺灣的鐵道之旅一定不會讓你失望！","a":217.88,"b":225.83,"c":[217.88,218.16,218.44,218.58,219.02,219.3,219.66,219.84,220.14,221.12,221.46,221.64,221.96,222.3,222.54,222.76,223.4,223.6,224.02,224.26,224.6,224.86,225.14,225.46]}],"audio":"audio/v5/L03.mp3"},{"n":4,"title":"單車自在行","lines":[{"t":"騎自行車一直是很受歡迎的休閒活動。","a":0.9,"b":5.86,"c":[0.9,1.32,1.52,1.76,2.3,2.48,2.84,3.16,3.42,3.8,3.96,4.24,4.56,4.84,5.22,5.44]},{"t":"尤其臺灣是有名的「自行車王國」，擁有捷安特、美利達等世界知名的自行車公司。","a":6.91,"b":17.87,"c":[6.91,7.15,7.47,7.69,8.21,8.61,8.89,9.13,9.55,9.83,10.13,10.47,10.73,11.93,12.17,12.55,12.77,12.99,13.75,14.01,14.25,14.57,14.91,15.27,15.59,15.79,16.03,16.39,16.69,16.93,17.25,17.41]},{"t":"臺灣地方不大，卻有著豐富多樣的地理環境，不管是哪種類型的單車騎士，都可以在臺灣找到喜歡的路線。","a":19.04,"b":33.38,"c":[19.04,19.3,19.64,19.84,20.1,20.32,21.12,21.4,21.73,22.06,22.36,22.74,22.94,23.24,23.58,23.84,24.1,24.32,25.68,25.94,26.18,26.5,26.76,27.1,27.3,27.54,27.82,28.08,28.34,28.62,29.52,29.84,30.06,30.36,30.62,30.82,31.42,31.72,32.0,32.26,32.5,32.7,32.92]},{"t":"臺東的關山環鎮自行車道是臺灣第一條自行車專用道。","a":34.6,"b":41.92,"c":[34.6,34.88,35.12,35.48,35.78,36.1,36.36,36.8,37.02,37.26,37.44,38.22,38.62,38.86,39.18,39.4,39.64,40.2,40.46,40.7,41.06,41.3,41.54]},{"t":"因為是自行車專用，路上不會出現汽車或是機車，相當安全，很適合親子旅遊。","a":43.04,"b":54.53,"c":[43.04,43.28,43.58,43.98,44.18,44.48,44.8,45.02,45.94,46.26,46.66,46.86,47.14,47.34,47.68,48.0,48.54,48.82,49.14,49.36,50.32,50.68,51.0,51.16,52.1,52.44,52.7,53.22,53.54,53.88,54.08]},{"t":"在這裡，春、夏、秋、冬各有不同的鄉村風景，所以每到放假的時候，都會吸引許多人。","a":56.03,"b":70.45,"c":[56.03,56.33,56.61,57.51,58.35,59.37,60.27,61.35,61.65,61.95,62.11,62.41,62.75,63.07,63.41,63.67,65.01,65.27,65.89,66.17,66.47,66.77,67.01,67.21,67.35,68.13,68.43,68.79,69.03,69.37,69.69,69.93]},{"t":"臺中的后豐鐵馬道原來是西部鐵道主要路線的一部分，長5.8公里。","a":71.86,"b":82.42,"c":[71.86,72.1,72.4,72.74,73.09,73.44,73.72,73.96,74.82,75.08,75.44,75. 34.07,34.29,34.71,34.95,35.29,35.55,35.77,36.21,36.43,36.67,36.97,37.27,37.53,37.75,38.76,39.1,39.64,39.84,40.16,40.38,41.08,41.36,41.56,42.06,42.4,42.8,42.98,43.26,43.46,43.76,43.96,44.12,44.44,44.7,44.98,45.3,45.64,45.84]},{"t":"他們在不同時期，因為不同原因來到臺灣，同時帶來了各地的飲食習慣。","a":47.21,"b":56.82,"c":[47.21,47.45,47.77,48.13,48.35,48.61,48.89,49.67,49.89,50.23,50.43,50.71,50.91,51.53,51.87,52.15,52.39,53.29,53.53,54.11,54.37,54.55,54.89,55.19,55.43,55.63,55.85,56.21,56.45]},{"t":"此外，早期的荷蘭人、日本人，還有後來因全球化而接觸到的許多國家，也都對臺灣飲食的食材應用、味道變化與烹飪技術等方面，產生了重要的影響。","a":57.59,"b":77.08,"c":[57.59,57.83,58.55,58.91,59.15,59.35,59.57,59.81,60.45,60.69,60.93,61.65,61.83,62.19,62.43,62.83,63.19,63.49,63.79,64.17,64.49,64.75,64.97,65.21,65.49,65.81,66.07,66.29,67.17,67.35,67.67,68.05,68.31,68.57,68.79,69.03,69.25,69.55,69.83,70.09,70.75,71.05,71.31,71.59,72.17,72.57,72.83,73.25,73.49,73.79,74.05,74.21,74.87,75.15,75.39,75.69,75.99,76.29,76.45,76.65]},{"t":"各地文化的交流與融合，給臺灣飲食建立了一個寬廣的基礎，慢慢地形成了既傳統又創新的「臺灣味」。","a":78.18,"b":91.73,"c":[78.18,78.48,78.76,78.96,79.2,79.36,79.62,80.06,80.3,80.52,81.42,81.8,82.0,82.26,82.54,83.18,83.44,83.68,83.84,84.04,84.42,84.74,85.04,85.26,85.52,86.44,86.72,86.98,87.24,87.5,87.74,88.06,88.44,88.74,89.4,89.74,90.06,90.3,90.74,91.08,91.38]},{"t":"比方說「珍珠奶茶」，就是融合了古今中外的食材與技術，產生的創新飲料。","a":92.68,"b":102.88,"c":[92.68,92.94,93.18,93.98,94.26,94.58,94.86,95.76,96.04,96.38,96.58,96.82,97.18,97.48,97.82,98.06,98.3,98.46,98.72,99.24,99.54,99.86,100.52,100.92,101.16,101.44,101.82,102.22,102.54]},{"t":"道地的「臺灣味」，可以透過不同的方式去品嚐，包括夜市小吃、餐廳的家常菜與精緻料理。","a":104.1,"b":116.67,"c":[104.1,104.38,104.62,105.0,105.4,105.7,106.52,106.72,106.98,107.2,107.58,107.78,108.02,108.18,108.38,108.88,109.18,109.46,110.46,110.76,111.28,111.6,111.94,112.2,113.04,113.34,113.64,113.92,114.1,114.4,114.98,115.4,115.72,116.08,116.32]},{"t":"其中，夜市是最有特色，也是最容易感受到「臺灣味」的地方。","a":117.53,"b":125.15,"c":[117.53,117.81,118.41,118.77,119.29,119.65,119.89,120.23,120.43,121.09,121.33,121.67,121.93,122.15,122.45,122.75,122.99,123.39,123.75,124.05,124.29,124.49,124.71]},{"t":"差不多每一個城市都有夜市，規模雖然不一樣，但是都能品嚐到當地的特色美食，感受不同的地方文化。","a":126.27,"b":140.74,"c":[126.27,126.55,126.71,127.19,127.49,127.67,127.89,128.21,128.65,128.87,129.13,129.41,130.33,130.65,131.17,131.43,131.69,131.99,132.15,132.87,133.11,133.63,133.87,134.29,134.59,134.95,135.35,135.61,135.91,136.19,136.51,136.81,137.03,137.95,138.23,138.67,138.89,139.19,139.47,139.79,140.13,140.39]},{"t":"很多夜市，除了食物，也常有玩樂與購物的攤子，非常熱鬧有趣。","a":141.38,"b":149.77,"c":[141.38,141.62,141.82,142.04,142.66,142.88,143.08,143.34,144.0,144.38,144.66,144.94,145.2,145.62,146.0,146.26,146.44,146.64,146.98,147.78,148.04,148.4,148.7,149.08,149.36]},{"t":"臺灣人喜歡逛夜市，因為夜市不只是夜市，而且是在辛苦工作之後，可以輕鬆自在地與家人朋友吃喝玩樂，花點小錢，得到一點快樂時光的地方。","a":151.0,"b":170.19,"c":[151.0,151.22,151.46,152.06,152.3,152.7,153.0,153.26,154.1,154.28,154.72,155.06,155.46,155.72,156.0,156.2,156.42,157.14,157.38,157.74,157.98,158.26,158.5,158.86,159.04,159.36,159.52,160.3,160.48,160.84,161.08,161.5,161.74,162.02,162.3,162.66,162.92,163.22,163.52,163.94,164.3,164.62,164.84,165.71,165.93,166.21,166.47,167.25,167.49,167.69,167.85,168.23,168.51,168.85,169.11,169.33,169.55,169.81]},{"t":"「幸福感」就常常在逛夜市時，一點一滴地進入臺灣人與外國旅客的心中。","a":171.07,"b":181.05,"c":[171.07,171.49,171.85,172.51,172.91,173.11,173.47,173.83,174.05,174.29,174.59,175.37,175.67,175.95,176.15,176.48,176.81,177.17,177.53,177.75,177.99,178.45,178.81,179.07,179.49,179.73,180.03,180.23,180.57]},{"t":"「臺灣味」代表的不僅是飲食，也是文化。","a":182.41,"b":187.62,"c":[182.41,182.73,183.03,183.59,183.81,184.05,184.37,184.53,184.83,185.17,185.49,186.33,186.67,187.01,187.27]},{"t":"更有趣的是，它的內容不是固定不變的，而是不斷創新、不斷形成的，總是讓人期待。","a":188.23,"b":199.5,"c":[188.23,188.55,188.77,189.07,189.19,189.87,190.15,190.35,190.55,191.09,191.27,191.73,192.05,192.41,192.59,192.89,193.49,193.71,194.11,194.37,194.67,194.97,195.59,195.87,196.15,196.47,196.83,197.74,198.0,198.4,198.6,198.9,199.26]},{"t":"透過美食獨特的魅力，「臺灣味」與世界各地的人們緊密連結，大家不僅品嚐了美食，也擁有了共同的記憶與情感。","a":200.3,"b":215.08,"c":[200.3,200.58,200.84,201.04,201.46,201.7,201.88,202.08,202.24,203.0,203.24,203.48,204.08,204.48,204.8,205.14,205.4,205.62,205.74,205.92,206.36,206.7,206.97,207.24,208.29,208.49,208.95,209.15,209.59,209.87,210.17,210.35,210.57,211.33,211.69,211.89,212.13,212.47,212.77,213.01,213.21,213.49,213.93,214.31,214.67]}],"audio":"audio/v5/L07.mp3"},{"n":8,"title":"臺灣節慶美食","lines":[{"t":"臺灣人很重視傳統節慶，每個節慶都有獨特的美食，也都會放假，讓大家能與家人團聚，一起品嚐美食，好好地過節。","a":0.9,"b":18.49,"c":[0.9,1.2,1.44,1.96,2.3,2.62,3.08,3.4,3.78,4.0,5.04,5.38,5.56,5.84,6.44,6.68,7.06,7.34,7.58,7.72,7.92,8.82,9.2,9.48,9.82,10.08,11.35,11.65,11.85,12.37,12.65,12.95,13.17,13.51,13.83,14.63,14.95,15.23,15.49,15.85,16.09,16.97,17.29,17.54,17.79,18.05]},{"t":"春節是慶祝農曆新年的節日，對臺灣人來說，總是要到春節才會有過新年的感覺，所以也把「春節」叫作「過年」，是傳統節日中最重要的，假期也最長。","a":19.45,"b":43.7,"c":[19.45,19.79,20.51,20.93,21.17,21.63,21.87,22.23,22.47,22.71,22.91,23.19,24.41,24.79,25.05,25.29,25.57,25.77,26.79,27.09,27.43,27.61,27.89,28.15,28.95,29.29,29.53,29.97,30.33,30.65,30.95,31.11,31.31,32.51,32.81,33.37,33.63,33.99,34.29,35.09,35.47,35.85,36.21,37.68,38.1,38.4,38.74,38.94,39.18,39.76,40.12,40.36,40.6,41.58,41.92,42.48,42.86,43.18]},{"t":"過年的美食，有年菜，還有特別的點心。","a":45.26,"b":50.49,"c":[45.31,45.65,45.96,46.18,46.38,47.06,47.47,47.77,48.72,49.02,49.32,49.62,49.87,50.07,50.29]},{"t":"「年菜」是用比較貴的食材與複雜的烹飪方式做的菜，很多在過年時才吃得到，不但要味道好，還要有吉祥的象徵意義，常常跟同音字有關。","a":51.74,"b":71.49,"c":[51.79,52.76,53.52,53.75,54.12,54.34,54.57,54.87,55.06,55.26,55.96,56.35,56.66,56.89,57.17,57.48,57.75,57.98,58.43,58.69,58.86,60.07,60.32,60.67,61.01,61.24,61.47,61.88,62.2,62.39,62.59,63.78,63.98,64.31,64.64,64.92,65.15,65.97,66.18,66.42,66.83,67.12,67.35,67.55,67.8,68.11,68.33,69.26,69.5,69.85,70.18,70.47,70.76,71.08,71.29]},{"t":"比方說，除夕時的年夜飯，一定要有一道用整條「魚」做的菜，象徵「年年有餘（魚）」。","a":72.48,"b":83.78,"c":[72.53,72.79,73.02,73.62,74.23,74.83,75.06,75.32,75.57,75.85,76.6,76.85,77.15,77.36,77.56,77.7,78.21,78.64,78.94,79.21,79.58,79.77,79.88,80.98,81.24,81.88,82.2,82.56,82.86,83.58]},{"t":"特別的點心是「年糕」，除了美味，最重要的是具有「年年高（糕）升」的象徵意義。","a":84.87,"b":95.48,"c":[84.87,85.15,85.39,85.53,85.81,86.39,86.87,87.19,88.6,88.86,89.06,89.28,90.06,90.4,90.66,90.9,91.28,91.7,91.9,92.5,92.86,93.24,93.38,93.52,93.82,94.18,94.52,94.9,95.12]},{"t":"過完春節，冬天也就過去了。","a":97.07,"b":100.56,"c":[97.12,97.41,97.66,97.93,98.67,98.96,99.37,99.6,99.89,100.13,100.36]},{"t":"接下來的節慶，就是春季的清明節。","a":101.59,"b":106.07,"c":[101.59,101.83,102.01,102.25,102.39,102.67,103.29,103.57,103.97,104.27,104.57,105.01,105.29,105.59]},{"t":"臺灣人在清明節掃墓祭祖，同時也要品嚐潤餅。","a":107.09,"b":113.76,"c":[107.09,107.39,107.63,108.09,108.43,108.63,108.87,109.23,109.47,109.83,110.07,111.01,111.25,111.85,112.09,112.39,112.63,113.05,113.29]},{"t":"潤餅的外面是薄薄的餅，裡面包的主要是春天的季節蔬菜，象徵春天萬物的生長。","a":114.76,"b":126.72,"c":[114.76,115.04,115.34,115.48,115.7,116.26,116.72,117.08,117.38,117.48,118.7,118.98,119.22,119.46,119.98,120.24,120.48,120.88,121.18,121.48,121.78,122.08,122.42,122.62,123.64,123.92,124.6,124.94,125.36,125.66,125.9,126.04,126.26]},{"t":"夏天，端午節到了，代表性的美食就是「粽子」。","a":128.28,"b":135.19,"c":[128.3,128.6,129.52,129.86,130.1,130.44,130.76,131.9,132.2,132.44,132.72,132.94,133.2,133.86,134.16,134.6,135.0]},{"t":"粽子大多是用竹葉包糯米、豬肉等多種食材做成的，種類與味道相當多樣。","a":136.32,"b":147.01,"c":[136.32,136.68,137.26,137.5,137.76,137.98,138.32,138.52,138.82,139.12,139.36,140.08,140.36,140.74,141.1,141.38,141.76,141.98,142.34,142.58,142.88,144.18,144.46,144.8,145.1,145.36,145.86,146.2,146.52,146.74]},{"t":"無論哪一種粽子，都要經過長時間的蒸煮，不但好吃也比較能保存。","a":147.86,"b":156.29,"c":[147.86,148.16,148.42,148.7,148.88,149.14,149.42,150.08,150.38,150.64,150.84,151.18,151.54,151.8,151.98,152.2,152.4,153.16,153.34,153.6,153.82,154.48,154.78,155.02,155.26,155.54,155.8]},{"t":"此外，人們還會在門上掛菖蒲與艾草，在屋子裡灑雄黃粉來除蟲。","a":157.13,"b":167.16,"c":[157.13,157.41,158.27,158.49,158.87,159.03,159.27,159.51,159.73,160.31,160.67,160.99,161.57,161.97,162.23,163.43,163.77,164.03,164.21,164.65,165.09,165.39,165.63,166.15,166.45,166.65]},{"t":"從這些習俗，可以看到早期臺灣人，在夏季時對食物與環境衛生的了解與重視。","a":168.04,"b":178.53,"c":[168.04,168.38,168.6,168.86,169.08,169.82,170.04,170.24,170.46,170.8,171.1,171.42,171.58,171.82,172.58,172.96,173.26,173.48,174.14,174.48,174.86,175.24,175.56,175.88,176.22,176.4,176.64,176.84,177.06,177.5,177.82,178.14]},{"t":"中秋節是秋天的節日，天氣逐漸涼爽，又能看到一年中最圓的月亮，很適合全家人一起「賞月」。","a":179.73,"b":193.39,"c":[179.73,180.03,180.33,181.11,181.57,181.89,182.13,182.27,182.49,183.61,183.91,184.27,184.51,184.81,185.05,185.93,186.13,186.41,186.61,187.01,187.19,187.43,187.87,188.21,188.57,188.73,188.93,190.07,190.39,190.59,190.99,191.25,191.55,192.01,192.33,192.69,192.99]},{"t":"不可缺少的美食是「月餅」，一種像月亮一樣圓的甜點。","a":194.44,"b":201.95,"c":[194.44,194.7,194.96,195.24,195.48,195.62,195.82,196.52,197.0,197.32,198.62,198.86,199.26,199.64,199.94,200.34,200.46,200.74,201.06,201.28,201.54]},{"t":"中秋節是傳統節慶裡，最有詩意的一個節日，詩人為中秋節的月亮寫了許多詩詞，比較有名的作品，臺灣人大多都能背誦。","a":203.01,"b":220.07,"c":[203.01,203.25,203.49,204.07,204.49,204.75,205.09,205.29,205.53,206.07,206.41,206.77,207.01,207.31,207.51,207.73,207.89,208.13,209.53,209.81,210.35,210.73,210.95,211.25,211.55,211.69,211.89,212.49,212.73,213.01,213.33,213.61,213.93,215.19,215.45,215.71,215.93,216.17,216.31,216.53,217.43,217.67,217.85,218.33,218.57,218.91,219.21,219.53,219.75]},{"t":"這點詩意，讓臺灣人在中秋節傳承的文化就不僅是月餅，也是生活的美感。","a":221.13,"b":231.32,"c":[221.13,221.43,221.71,221.97,222.65,222.97,223.23,223.41,223.97,224.33,224.59,224.83,225.21,225.49,225.73,225.97,226.21,226.87,227.21,227.47,227.75,228.05,228.29,229.17,229.43,229.83,230.09,230.39,230.59,230.81]},{"t":"臺灣節慶的魅力，來自美食與內在的意義。","a":232.59,"b":237.66,"c":[232.59,232.85,233.19,233.45,233.69,233.85,234.05,234.71,234.95,235.29,235.55,236.07,236.47,236.73,236.97,237.11,237.39]},{"t":"人們透過不同季節的節日和食物，與自然、祖先、家人對話。","a":238.65,"b":247.04,"c":[238.65,238.89,239.25,239.43,239.67,239.83,240.13,240.43,240.61,240.83,241.09,241.49,241.85,242.17,242.95,243.39,243.65,244.57,244.91,245.79,246.11,246.45,246.71]},{"t":"反映了臺灣人對自然環境的了解與尊重，對家人的情感，以及對美好生活的期待。","a":247.99,"b":258.78,"c":[247.99,248.21,248.51,248.85,249.11,249.29,249.75,250.11,250.37,250.69,250.95,251.13,251.31,251.55,251.99, ":[88.51,88.73,88.87,89.09,89.61,89.87,90.15,90.35,91.15,91.41,91.79,92.23,93.21,93.75,94.03,94.61,94.93,95.29,95.59,96.05,96.25,96.47,97.29,97.49,97.95,98.21,98.47,98.75,99.63,99.85,100.33,100.63,100.95,101.17,101.93,102.17,102.84,103.51,103.77,104.09,104.31,105.11,105.33,105.57,105.77,106.15,106.49,106.69,106.99]},{"t":"鶯歌的陶瓷產品五花八門，小自茶具、碗盤，大至陶瓷藝術品，樣樣都能讓你驚喜。","a":108.51,"b":120.47,"c":[108.51,108.79,109.03,109.21,109.45,109.77,109.99,110.59,110.89,111.19,111.35,112.19,112.55,112.91,113.27,113.85,114.17,115.03,115.4,115.77,116.07,116.49,116.67,116.91,117.67,117.91,118.31,118.57,119.05,119.35,119.73,120.01]},{"t":"現在的鶯歌結合傳統工藝與現代設計，由小鎮轉變成具有新風格的文創城市，也讓大家重新認識陶瓷的魅力。","a":121.67,"b":137.15,"c":[121.72,121.94,122.24,122.46,122.72,123.34,123.62,124.02,124.28,124.6,124.76,125.26,125.62,125.88,126.22,126.48,127.26,127.64,127.92,128.52,128.76,129.0,129.46,129.7,130.0,130.28,130.6,130.9,131.2,131.56,131.94,132.22,133.02,133.24,133.5,133.7,134.28,134.6,134.94,135.14,135.58,135.98,136.34,136.54,136.82]},{"t":"三峽是臺灣最早開始藍染工藝的地方。","a":138.17,"b":142.98,"c":[138.17,138.47,138.97,139.41,139.61,139.91,140.21,140.59,140.81,141.1,141.39,141.73,141.93,142.17,142.37,142.59]},{"t":"「藍染」是一種利用植物的顏色把布染成藍色的工藝。","a":143.87,"b":150.5,"c":[143.87,144.27,144.79,145.07,145.21,145.67,145.87,146.11,146.35,146.59,146.75,147.01,147.71,148.01,148.57,148.85,149.27,149.51,149.75,149.95,150.17]},{"t":"十九世紀初，許多從福建安溪來的人移居到三峽。","a":151.35,"b":158.14,"c":[151.36,151.62,151.94,152.16,152.4,153.18,153.48,153.8,154.18,154.44,154.82,155.08,155.4,155.68,155.8,156.44,156.76,157.06,157.34,157.64]},{"t":"三峽地區適合藍染原料馬藍（大菁）生長，再加上附近有乾淨的河水，居民就用家鄉的藍染技術，開始做生意。","a":159.22,"b":174.48,"c":[159.22,159.5,159.82,159.98,160.56,160.82,161.22,161.42,161.76,161.94,162.54,163.1,163.66,164.03,164.4,164.64,165.65,166.03,166.19,166.61,166.85,167.15,167.43,167.73,168.03,168.23,168.51,169.37,169.65,170.11,170.29,170.71,170.95,171.19,171.47,171.73,172.07,172.31,172.95,173.21,173.59,173.89,174.17]},{"t":"十九世紀中至二十世紀初，是三峽藍染工藝最繁榮的時期。","a":175.38 ":"蘭嶼之所以有「蘭嶼」這個名字，是因為島上早期盛產蘭花。","a":174.21,"b":181.52,"c":[174.27,174.43,174.81,175.01,175.25,175.43,175.87,176.19,176.67,176.83,176.97,177.25,178.31,178.59,178.81,179.11,179.33,179.77,180.03,180.41,180.63,180.95,181.15]},{"t":"住在這裡的雅美（達悟）族人，是臺灣唯一居住在離島的原住民族，至今仍然保持著傳統文化與風俗。","a":182.27,"b":194.48,"c":[182.33,182.49,182.75,182.89,183.07,183.27,183.47,183.93,184.19,184.41,184.65,185.61,185.93,186.19,186.45,186.65,187.05,187.25,187.49,187.75,187.95,188.19,188.53,188.71,189.03,189.19,190.25,190.45,191.05,191.23,191.51,191.75,191.99,192.27,192.57,192.91,193.11,193.47,193.77,193.99]},{"t":"在屏東西方海上的小琉球，是臺灣離島中唯一的珊瑚礁島。","a":195.63,"b":203.4,"c":[195.69,195.99,196.33,196.59,196.85,197.17,197.43,197.67,197.93,198.19,198.43,199.51,199.89,200.15,200.39,200.61,200.79,201.39,201.67,201.91,202.31,202.61,202.85,203.09]},{"t":"氣候溫和，是觀賞海龜的知名地點。","a":204.48,"b":208.78,"c":[204.57,204.81,205.07,205.29,206.01,206.39,206.65,206.91,207.17,207.41,207.69,207.93,208.21,208.41]},{"t":"小琉球面積不大，島上沒有紅綠燈，最受歡迎的環島方式是騎電動機車，既輕鬆，又環保，是享受悠閒生活與生態旅遊的好選擇。","a":209.68,"b":227.58,"c":[209.75,209.95,210.17,210.51,210.69,210.95,211.09,212.11,212.33,212.63,212.85,213.09,213.31,213.47,214.83,215.03,215.29,215.51,215.73,216.01,216.21,216.47,216.67,217.25,217.51,217.95,218.21,218.49,218.69,220.07,220.37,220.63,221.21,221.55,221.79,222.71,223.07,223.27,223.63,223.85,224.15,224.39,224.89,225.19,225.45,225.85,226.05,226.27,226.53,226.89,227.17]},{"t":"臺灣的離島不僅景色迷人，更因各離島的歷史背景、地理位置、地形特性和生態環境，發展出獨特的人文風貌與自然景觀，讓去過的人留下美好、難忘的回憶。","a":228.62,"b":249.34,"c":[228.69,228.89,229.07,229.25,229.41,229.93,230.05,230.39,230.65,230.89,231.11,232.09,232.25,232.65,232.87,233.13,233.29,233.57,233.77,234.07,234.29,235.11,235.25,235.49,235.69,236.67,236.89,237.21,237.41,237.97,238.27,238.53,238.77,239.05,239.81,240.01,240.19,240.59,240.83,241.07,241.35,241.61,241.87,242.13,242.61,242.95,243.19,243.47,243.73,244.95,245.25,245.57,245.81,245.91,246.45,246.69,247.03,247.27,247.93,248.23,248.51,248.71,248.99]}],"audio":"audio/v6/L04.mp3"},{"n":5,"title":"臺灣戲曲－歌仔戲","lines":[{"t":"「歌仔戲」是臺灣最具代表性的本土傳統戲曲，起源於十九世紀末的臺灣宜蘭，最早是由福建漳州民間流行的「歌仔」和「車鼓戲」發展來的。","a":0.95,"b":19.34,"c":[1.01,1.25,1.55,2.13,2.59,2.79,3.19,3.51,3.83,4.03,4.27,4.57,4.91,5.23,5.63,5.99,6.33,6.59,7.67,7.87,8.11,8.49,8.75,9.01,9.23,9.39,9.63,9.93,10.21,10.47,10.75,11.99,12.23,12.69,12.89,13.25,13.49,13.81,14.07,14.41,14.61,15.05,15.27,15.55,15.85,16.15,16.79,17.27,17.59,17.87,18.35,18.59,18.85,19.13]},{"t":"「歌仔」是每首四句，每句七個字或五個字的民間歌謠，「車鼓戲」則是又歌又舞的戲曲。","a":20.19,"b":32.66,"c":[20.25,20.55,21.03,21.55,21.83,22.21,22.47,23.47,23.65,24.07,24.37,24.53,25.05,25.45,25.77,25.95,26.19,26.55,26.77,27.13,27.37,28.71,29.01,29.31,29.93,30.13,30.67,30.95,31.29,31.55,31.83,32.03,32.25]},{"t":"當時在宜蘭地區漳州的移民很多，因此「歌仔」與「車鼓戲」，就在宜蘭融合成「本地歌仔」。","a":33.55,"b":45.22,"c":[33.61,33.77,34.15,34.53,34.71,35.03,35.25,35.63,35.89,36.13,36.33,36.47,36.89,37.19,38.21,38.39,39.05,39.35,39.97,40.41,40.71,40.95,41.57,41.85,42.17,42.37,42.91,43.15,43.39,43.89,44.21,44.61,44.81]},{"t":"後來又結合了其他戲曲，穿上了戲服，化了妝，打扮成各種角色上臺，才成為現在臺灣的「歌仔戲」。","a":46.09,"b":60.44,"c":[46.15,46.35,46.99,47.29,47.53,47.75,48.09,48.41,48.73,49.05,49.93,50.19,50.47,50.67,50.93,51.65,51.93,52.11,53.07,53.27,53.49,54.03,54.27,54.65,54.97,55.35,55.61,56.73,57.07,57.33,57.79,58.09,58.49,58.79,59.03,59.37,59.73,60.09]},{"t":"「歌仔戲」是用臺灣台語來表演的，音樂具有明顯的地方特色，旋律優美動聽。","a":61.57,"b":71.86,"c":[61.63,61.85,62.15,62.77,62.97,63.37,63.57,63.91,64.21,64.53,64.87,65.15,65.45,66.39,66.55,66.95,67.13,67.41,67.67,67.95,68.21,68.43,68.75,69.01,69.97,70.21,70.53,70.73,71.15,71.43]},{"t":"戲曲內容通俗易懂，有具教育意義的歷史故事，也有與人民生活有關的愛情故事。","a":72.36,"b":83.44,"c":[72.43,72.69,72.93,73.15,73.61,73.91,74.35,74.61,75.53,75.81,76.21,76.45,76.71,76.87,77.09,77.43,77.75,78.09,78.27,79.27,79.43,79.87,80.17,80.31,80.65,80.91,81.23,81.49,81.79,82.15,82.43,82.85,83.09]},{"t":"觀眾就是不認識字，也能透過動作與旋律產生共鳴。","a":84.57,"b":91.5,"c":[84.63,84.83,85.27,85.43,85.81,86.03,86.25,86.49,87.15,87.45,87.75,87.97,88.31,88.51,89.01,89.33,89.57,90.09,90.35,90.75,91.01]},{"t":"歌仔戲最早是為了感謝神，在廟口以「野臺戲」的形式演出，是人民生活中重要的娛樂和宗教儀式，就是到現在也還能在廟前看到一些野臺戲。","a":92.87,"b":112.72,"c":[92.93,93.09,93.39,94.03,94.27,94.51,94.89,95.09,95.31,95.49,95.79,96.77,97.13,97.41,98.03,98.37,98.71,99.05,99.29,99.51,99.81,100.15,100.41,101.41,101.75,101.91,102.39,102.67,102.91,103.39,103.69,103.91,104.11,104.33,104.73,105.07,105.33,105.67,105.87,106.95,107.09,107.41,107.75,108.05,108.63,108.95,109.17,109.49,109.87,110.17,110.73,111.01,111.21,111.41,111.75,112.01,112.37]},{"t":"後來隨著廣播、電視興起，歌仔戲透過媒體進入家庭。","a":113.69,"b":120.9,"c":[113.75,113.91,114.43,114.67,114.95,115.19,115.77,116.03,116.35,116.55,117.57,117.75,117.97,118.49,118.67,118.87,119.13,119.61,119.91,120.17,120.37]},{"t":"電視歌仔戲吸引了成千上萬的觀眾，並創造出許多知名的歌仔戲演員，更是許多人的回憶。","a":121.75,"b":133.8,"c":[121.81,122.11,122.49,122.65,122.87,123.55,123.83,124.01,124.29,124.65,125.05,125.31,125.53,125.73,125.95,126.89,127.25,127.51,127.75,128.17,128.45,128.71,128.97,129.21,129.53,129.81,130.09,130.37,130.57,131.63,131.83,132.21,132.53,132.75,133.05,133.21,133.51]},{"t":"近年來，娛樂形式多元化，歌仔戲的觀眾逐漸減少，對傳統戲曲帶來很大的影響，因此有一些歌仔戲劇團像「明華園」積極改革，引進現代的舞臺技術、燈光設計，讓歌仔戲展現出既傳統又創新的樣貌，不但登上國家戲劇院的舞臺，甚至到國外巡迴演出。","a":134.89,"b":169.38,"c":[134.95,135.11,135.35,135.99,136.17,136.37,136.63,137.05,137.21,137.51,138.41,138.57,138.81,139.03,139.17,139.31,139.93,140.21,140.59,140.85,141.87,142.19,142.45,142.71,142.97,143.51,143.67,143.95,144.27,144.55,144.77,144.97,146.25,146.47,147.05,147.27,147.43,147.83,148.03,148.33,148.69,148.91,149.63,150.23,150.53,150.89,151.51,151.79,152.03,152.25,152.93,153.21,153.57,153.87,154.11,154.39,154.57,154.91,155.11,155.69,155.89,156.23,156.43,157.37,157.73,157.93,158.15,158.75,158.97,159.21,159.55,159.85,160.15,160.61,160.91,161.21,161.45,161.65,161.87,162.87,162.99,163.31,163.53,163.91,164.19,164.53,164.83,165.07,165.25,165.39,165.59,166.47,166.73,167.11,167.49,167.73,168.15,168.45,168.79,169.05]},{"t":"此外，劇團也常到校園表演，並改變演出方式，從臺上走到臺下，與觀眾互動，讓歌仔戲更吸引年輕觀眾。","a":170.29,"b":185.04,"c":[170.35,170.51,171.17,171.45,172.01,172.31,172.57,172.87,173.17,173.47,173.69,174.61,174.97,175.21,175.55,175.73,176.05,176.25,177.19,177.43,177.83,178.31,178.53,178.73,179.05,179.55,179.85,180.05,180.39,180.65,181.49,181.85,182.07,182.29,182.87,183.21,183.47,183.75,184.07,184.47,184.71]},{"t":"政府與民間團體也推廣歌仔戲，學校把歌仔戲放進課程當中，也在校園成立社團，年輕一代有機會接觸並且了解這項傳統戲曲，讓傳統藝術的種子在年輕人心中，發芽、長大。","a":185.98,"b":210.14,"c":[186.05,186.31,186.55,186.75,186.89,187.17,187.43,187.99,188.31,188.55,188.95,189.13,189.37,190.47,190.67,191.07,191.33,191.55,191.79,192.21,192.49,192.89,193.13,193.47,193.73,194.73,194.89,195.15,195.41,195.79,196.05,196.31,196.51,197.85,198.05,198.31,198.47,198.97,199.21,199.41,199.75,200.01,200.51,200.71,201.07,201.31,201.65,201.79,202.17,202.49,202.89,203.15,204.11,204.47,204.73,205.07,205.27,205.49,205.63,205.91,206.61,206.95,207.27,207.51,207.87,208.11,208.67,208.93,209.53,209.83]},{"t":"歌仔戲隨著社會的變化不斷發展創新，從廟口的野臺走向電視舞臺，再發展到現代劇場與國際舞臺。","a":211.13,"b":225.54,"c":[211.19,211.37,211.67,212.33,212.61,212.95,213.21,213.45,213.65,213.85,214.35,214.63,214.91,215.15,215.61,215.93,217.03,217.39,217.71,217.93,218.07,218.29,218.93,219.17,219.59,219.87,220.15,220.35,221.41,221.71,221.97,222.19,222.59,222.91,223.17,223.37,223.93,224.29,224.55,224.81,225.03]},{"t":"歌仔戲展現了臺灣人民生活的情感與本土文化的多樣性，不僅是一項表演藝術，更是臺灣社會文化的縮影。","a":226.24,"b":240.2,"c":[226.31,226.45,226.69,227.27,227.53,227.77,228.03,228.23,228.51,228.71,229.19,229.43,229.71,229.89,230.19,230.81,231.13,231.39,231.73,231.91,232.21,232.49,232.75,233.05,234.11,234.23,234.53,234.89,235.01,235.37,235.65,235.93,236.19,236.85,237.13,237.53,237.73,238.09,238.33,238.67,238.91,239.21,239.49,239.87]}],"audio":"audio/v6/L05.mp3"},{"n":6,"title":"臺灣布袋戲的魅力","lines":[{"t":"布袋戲是臺灣最具代表性的傳統表演藝術之一，融合了民間信仰、文學、戲曲與手工藝。","a":0.79,"b":13.36,"c":[0.85,1.01,1.25,1.99,2.35,2.55,2.89,3.15,3.49,3.69,3.91,4.21,4.53,4.81,5.23,5.45,5.79,5.99,6.31,6.47,7.49,7.69,7.91,8.31,8.55,8.89,9.13,9.99,10.23,11.23,11.53,12.19,12.55,12.83,13.05]},{"t":"以小巧的戲偶為主，表演師傅靈活地運用手掌操控戲偶的動作，配合優美的唱腔、口白展現出獨特的藝術魅力。","a":14.07,"b":28.94,"c":[14.13,14.39,14.63,14.93,15.11,15.39,15.63,15.85,16.73,16.89,17.15,17.37,17.93,18.19,18.43,18.75,18.97,19.25,19.55,20.11,20.33,20.69,20.91,21.15,21.35,21.57,22.75,22.97,23.29,23.55,23.79,23.93,24.19,24.95,25.25,26.27,26.43,26.67,27.05,27.37,27.59,27.85,28.13,28.43,28.65]},{"t":"從早期的廟口演出到現代的電視與網路傳播，布袋戲的形式雖然不斷改變創新，但始終存在於民眾的生活與情感中。","a":29.85,"b":45.0,"c":[29.91,30.21,30.47,30.71,30.97,31.23,31.49,31.69,32.57,32.85,33.17,33.33,33.53,33.75,34.17,34.43,34.69,34.95,35.21,36.07,36.23,36.47,36.71,36.85,37.11,37.77,37.99,38.27,38.47,38.83,39.05,39.41,39.65,40.57,40.83,41.09,41.43,41.67,41.85,42.21,42.45,42.67,42.95,43.21,43.71,44.05,44.39,44.63]},{"t":"布袋戲起源於十七世紀，由福建泉州傳到臺灣。","a":45.87,"b":51.92,"c":[45.93,46.09,46.27,46.67,46.91,47.07,47.53,47.79,48.09,48.31,49.15,49.47,49.77,50.11,50.37,50.87,51.13,51.37,51.59]},{"t":"早期為了感謝神明和娛樂民眾，在廟會或祭典上演出，內容多半是以勸人做好事為主。","a":52.53,"b":63.62,"c":[52.59,52.81,53.43,53.63,53.83,54.05,54.35,54.63,54.99,55.33,55.51,55.77,55.99,57.01,57.27,57.51,57.85,58.13,58.33,58.57,58.89,59.09,60.21,60.41,60.77,60.93,61.13,61.35,61.75,61.99,62.31,62.55,62.81,63.07,63.29]},{"t":"當時戲偶的頭、手、腳都是用木頭雕刻成的，頭部是中空的，手指可以伸進去操控戲偶，身體和四肢則是用布做成的。","a":64.21,"b":80.86,"c":[64.27,64.43,64.83,65.13,65.29,65.41,66.25,67.37,68.35,68.51,68.73,69.01,69.27,69.57,69.79,70.01,70.31,71.19,71.43,71.87,72.17,72.37,72.65,73.67,73.91,74.29,74.43,74.71,74.97,75.13,75.53,75.73,76.03,76.25,77.37,77.63,77.93,78.17,78.39,79.03,79.21,79.41,79.69,80.13,80.33,80.63]},{"t":"操控戲偶的師傅配合音樂，透過唱、念、動作表現出角色的個性與情感。","a":81.64,"b":91.42,"c":[81.71,81.91,82.19,82.37,82.55,82.73,82.89,83.45,83.67,83.93,84.13,85.07,85.21,85.37,86.47,87.45,87.67,88.43,88.59,88.83,89.19,89.47,89.65,89.85,90.11,90.47,90.79,91.05]},{"t":"這種結合手工藝與戲劇的表演形式，不僅娛樂民眾，也傳播道德觀念與做人做事的道理。","a":92.13,"b":103.02,"c":[92.19,92.35,92.63,92.83,93.15,93.35,93.59,94.09,94.39,94.71,94.89,95.11,95.29,95.63,95.83,96.83,96.91,97.25,97.43,97.69,97.89,98.77,99.03,99.29,99.65,99.87,100.13,100.29,100.83,101.15,101.47,101.81,102.13,102.35,102.49,102.71]},{"t":"隨著電視的普遍，布袋戲進入新的發展階段。","a":104.12,"b":109.48,"c":[104.21,104.45,104.75,105.03,105.19,105.39,105.59,106.73,106.89,107.07,107.47,107.71,107.99,108.23,108.51,108.71,108.95,109.17]},{"t":"1960年代，一些布袋戲劇團登上電視，引起布袋戲大流行，特別是1980年代的「雲州大儒俠史艷文」，劇中緊張的劇情、英雄的形象，受到全臺民眾的歡迎，讓布袋戲進入各個家庭，也奠定了現代布袋戲的基礎。","a":110.29,"b":138.22,"c":[110.35,111.13,111.29,112.19,112.35,112.63,112.81,113.07,113.29,113.51,113.91,114.17,114.43,114.63,115.59,115.75,116.07,116.27,116.49,116.87,117.15,117.37,118.43,118.57,118.81,119.15,120.13,120.29,120.51,121.05,121.35,121.73,122.01,122.23,122.71,123.01,123.31,124.71,124.93,125.19,125.45,125.67,125.81,126.01,126.95,127.15,127.39,127.53,127.77,128.73,128.99,129.23,129.51,129.85,130.09,130.33,130.45,130.67,131.59,131.93,132.13,132.35,132.79,132.99,133.35,133.53,133.71,133.93,134.91,135.17,135.43,135.71,136.13,136.43,136.75,136.95,137.25,137.47,137.61,137.83]},{"t":"然而，後來因為電視娛樂的種類增加，布袋戲在1980年代後逐漸沒落。","a":139.12,"b":148.2,"c":[139.27,139.49,140.31,140.51,140.83,141.03,141.31,141.51,141.85,142.09,142.27,142.41,142.61,142.89,143.09,144.25,144.41,144.59,144.97,145.25,146.19,146.35,146.59,147.11,147.35,147.65,147.89]},{"t":"就在這個時候，「霹靂布袋戲」劇團為臺灣布袋戲加入新的活力，他們引進現代電影的技術、聲光特效，將布袋戲結合武俠、奇幻、科技，開創了新的視聽感受，使布袋戲由傳統民間娛樂轉型成跨世代的流行文化。","a":148.89,"b":177.38,"c":[148.95,149.09,149.35,149.49,149.63,149.83,151.05,151.25,151.53,151.73,151.91,152.21,152.37,153.07,153.43,153.69,153.97,154.21,154.39,154.93,155.11,155.43,155.69,155.83,156.05,157.29,157.45,157.65,157.85,158.27,158.51,158.81,159.03,159.27,159.39,159.61,160.61,160.89,161.15,161.39,162.31,162.55,162.77,162.93,163.41,163.63,163.91,164.17,164.91,165.23,166.15,166.43,167.29,167.49,167.71,167.97,168.25,168.53,168.83,169.09,169.29,170.51,170.81,171.07,171.25,171.83,172.19,172.49,172.83,173.03,173.37,173.57,174.23,174.51,174.75,175.23,175.55,175.77,175.99,176.29,176.53,176.87,177.07]},{"t":"霹靂劇團也把布袋戲帶到國際市場，讓臺灣布袋戲成為代表臺灣文化的符號之一。","a":178.45,"b":189.4,"c":[178.51,178.69,178.95,179.11,179.79,179.99,180.27,180.53,180.75,181.23,181.47,181.75,181.99,182.27,182.53,183.59,183.91,184.23,184.51,184.77,184.99,185.65,185.89,186.29,186.49,186.85,187.07,187.35,187.61,187.85,188.19,188.49,188.81,189.09]},{"t":"現代布袋戲不僅在傳統劇場表演，更與動畫、電玩，甚至流行音樂合作，展現出強大的創新力。","a":190.5,"b":202.54,"c":[190.59,190.83,191.15,191.31,191.47,192.09,192.25,192.49,192.77,193.01,193.35,193.59,193.85,194.01,195.05,195.23,195.51,195.77,196.43,196.71,197.49,197.71,198.05,198.25,198.61,198.77,199.05,199.31,200.27,200.49,200.71,200.99,201.31,201.53,201.73,201.93,202.23]},{"t":"除了霹靂劇團以外，也有一些年輕的團隊以小型劇場與校園巡迴表演的方式，再次展現出布袋戲的文化精神。","a":203.68,"b":217.86,"c":[203.75,203.95,204.19,204.41,204.65,204.87,205.11,205.27,206.27,206.47,206.71,206.87,207.21,207.45,207.75,207.87,208.15,209.13,209.39,209.71,210.03,210.23,210.91,211.27,211.55,211.91,212.19,212.45,212.67,212.89,213.03,213.25,214.19,214.43,214.69,214.83,215.07,215.47,215.79,216.01,216.25,216.61,216.83,217.15,217.37]},{"t":"臺灣布袋戲從廟口野臺戲發展成跨國娛樂產業，它既保留了傳統宗教、娛樂的功能，也隨著時代演變融入現代媒體與藝術形式，充分表現出臺灣文化的創造力，成為傳統與現代結合的文化象徵。","a":219.36,"b":246.7,"c":[219.43,219.63,219.91,220.09,220.27,221.03,221.41,221.69,222.03,222.27,222.51,223.39,223.57,223.79,224.21,224.51,224.85,225.09,225.27,225.55,226.77,226.99,227.31,227.45,227.69,228.01,228.27,228.59,228.79,229.61,229.81,230.05,230.17,230.31,231.45,231.71,231.97,232.25,232.51,232.77,233.03,233.71,233.99,234.27,234.51,234.83,235.05,235.57,235.91,236.23,236.57,236.77,237.97,238.17,238.51,238.69,238.93,239.45,239.71,239.97,240.23,240.47,240.69,240.99,241.17,242.17,242.37,242.67,242.97,243.47,243.83,244.09,244.41,244.67,244.91,245.37,245.61,246.01,246.27]}],"audio":"audio/v6/L06.mp3"},{"n":7,"title":"養生飲食","lines":[{"t":"養生是臺灣人生活的一部分，尤其注重透過飲食來養生。","a":0.69,"b":8.37,"c":[0.76,1.02,1.56,2.0,2.2,2.44,2.94,3.2,3.5,3.68,3.84,4.08,5.08,5.24,5.7,5.88,6.36,6.6,6.8,7.06,7.48,7.66,7.94]},{"t":"人們相信，吃對東西除了能保養身體，也能預防生病，甚至治療疾病，因此形成了獨特的養生飲食文化。","a":9.03,"b":23.21,"c":[9.1,9.24,9.46,9.72,10.38,10.68,10.98,11.2,11.72,11.92,12.1,12.44,12.62,12.9,13.16,13.86,14.1,14.52,14.76,15.12,15.42,16.46,16.68,17.08,17.32,17.62,17 const CN = ["一","二","三","四","五","六","七","八","九","十","十一"];
let CURV = 0;
const VOLS = [{n:"一",ready:true},{n:"二",ready:true},{n:"三",ready:true},{n:"四",ready:true},{n:"五",ready:true,min:120,max:280,val:170},{n:"六",ready:true,min:150,max:300,val:200}];
const $ = id => document.getElementById(id);
const player = $('player'), speed = $('speed'), goBtn = $('go');
let cur = 0, timer = null, lineEls = [];

VOLS.forEach((v,i) => {
  const d = document.createElement('div');
  d.className = 'vol' + (v.ready ? '' : ' off');
  d.innerHTML = '<span class="num">' + v.n + '</span><span class="name">第' + v.n + '冊</span>' + (v.ready ? '' : '<span class="soon">準備中</span>');
  if (v.ready) d.onclick = () => openVol(i);
  $('vols').appendChild(d);
});

let LES = DATA.vols[0].lessons;
function buildToc(){
  $('toc').innerHTML = '';
  $('toc').style.gridTemplateColumns = LES.length > 10 ? 'repeat(6,1fr)' : '';
  LES.forEach((l,i) => {
    const b = document.createElement('button');
    b.textContent = '第' + CN[i] + '課';
    b.onclick = () => select(i);
    $('toc').appendChild(b);
  });
}

function openVol(i){
  CURV = i; LES = DATA.vols[i].lessons;
  speed.min = VOLS[i].min || 100; speed.max = VOLS[i].max || 260; speed.value = VOLS[i].val || 150;
  buildToc();
  $('home').classList.remove('on'); $('vol').classList.add('on');
  $('vol-title').textContent = '第' + VOLS[i].n + '冊';
  window.scrollTo(0,0);
  select(0);
}
function goHome(){
  stopAll();
  $('vol').classList.remove('on'); $('home').classList.add('on');
  window.scrollTo(0,0);
}
function rate(){
  const L = LES[cur], n = L.lines.reduce((s,l)=>s+l.c.length,0);
  const native = n / (L.lines[L.lines.length-1].b - L.lines[0].a) * 60;
  const v = parseFloat(speed.value);
  $('cpm').textContent = '每分鐘約 ' + v + ' 字';
  return v / native;
}
function stopAll(){ player.pause(); clearInterval(timer); timer = null; }

function select(i){
  stopAll();
  cur = i;
  const L = LES[i];
  [...$('toc').children].forEach((b,j) => b.classList.toggle('active', j === i));
  $('ltitle').textContent = '第' + CN[i] + '課　' + L.title;
  const U = CURV >= 4
    ? /([^A-Za-z0-9\u4e00-\u9fff]*(?:[A-Za-z]+|[0-9]+(?:\.[0-9]+)?|[\u4e00-\u9fff]))([^A-Za-z0-9\u4e00-\u9fff]*)/g
    : /([A-Za-z]+|[\u4e00-\u9fff])([^A-Za-z\u4e00-\u9fff]*)/g;
  $('stage').innerHTML = L.lines.map(ln =>
    '<div class="line">' + [...ln.t.matchAll(U)].map(m => '<span class="c-next">' + m[1] + m[2] + '</span>').join('') + '</div>').join('');
  lineEls = [...$('stage').children];
  player.src = L.audio;
  player.playbackRate = rate();
  goBtn.textContent = '▶ 開始';
}

function paint(){
  const L = LES[cur], t = player.currentTime;
  let k = 0;
  for (let i = 0; i < L.lines.length; i++) if (t >= L.lines[i].a - 0.05) k = i;
  lineEls.forEach((el,i) => {
    const sp = el.children;
    el.classList.toggle('now', i === k);
    if (i < k) { for (const s of sp) s.className = 'c-done'; }
    else if (i > k) { for (const s of sp) s.className = 'c-next'; }
    else {
      const ln = L.lines[i], c = ln.c;
      let idx = -1;
      for (let j = 0; j < c.length; j++) if (t >= c[j]) idx = j;
      if (t > ln.b) idx = sp.length;
      [...sp].forEach((s,j) => s.className = j < idx ? 'c-done' : (j === idx ? 'c-cur' : 'c-next'));
    }
  });
  const now = lineEls.find(e => e.classList.contains('now'));
  if (now) now.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function reset(){ lineEls.forEach(el => { el.classList.remove('now'); for (const s of el.children) s.className = 'c-next'; }); }

player.onplay = () => { goBtn.textContent = '⏸ 停止'; clearInterval(timer); timer = setInterval(paint, 50); };
player.onpause = () => { goBtn.textContent = '▶ 開始'; clearInterval(timer); timer = null; };
player.onended = () => {
  clearInterval(timer); timer = null; goBtn.textContent = '▶ 開始';
  lineEls.forEach(el => { el.classList.remove('now'); for (const s of el.children) s.className = 'c-done'; });
};

goBtn.onclick = () => {
  if (player.paused) {
    if (player.ended) { reset(); player.currentTime = 0; }
    player.playbackRate = rate(); player.play();
  } else player.pause();
};
$('again').onclick = () => { reset(); player.currentTime = 0; player.playbackRate = rate(); player.play(); };
speed.oninput = () => { player.playbackRate = rate(); };
</script>
</body>
</html>
